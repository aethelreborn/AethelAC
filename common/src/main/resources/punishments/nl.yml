      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "60:0 kick %player% AethelAC: Machine-constant rotation"
      - "120:0 ban %player% 30d AethelAC: Machine-constant rotation (%vl% violations)"
  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
      - "MaceSmash"
      - "CrystalCadence"
      - "AnchorCadence"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Combat violation"
      - "140:0 ban %player% 30d AethelAC: Combat violations (%vl%)"
  # Vanaf 2.2.10 zijn er geen AutoClicker-controles en is dit een placeholder. Aethel zal in de toekomst AutoClicker-controles toevoegen.

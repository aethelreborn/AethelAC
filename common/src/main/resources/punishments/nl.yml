# %check_name% - naam van de controle
# %description% - description of the check
# %vl% - overtredingen
# %verbose% - extra informatie
# %player% - spelersnaam
# [alert] - speciaal commando om te waarschuwen
# [webhook] - speciaal commando om discord webhook te waarschuwen
# [proxy] - speciaal commando om te waarschuwen voor andere servers die verbonden zijn met je proxy (BungeeCord/Velocity)
Punishments:
  Simulation:
    # Na hoeveel seconden moet een overtreding worden verwijderd?
    remove-violations-after: 600
    # Deze sectie zal overeenkomen met alle controles met de naam,
    # Om een controle uit te sluiten die anders wel overeen zou komen, zet je een uitroepteken voor de naam.
    # Bijvoorbeeld, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Drempel: Interval-commando
    #
    # Voorbeeld, om de speler te schoppen met het bericht "verkeerde beweging!" na 100 overtredingen, zonder interval
    # commando's:
    # - "100:0 kick %player% incorrecte beweging!"
    # 0 betekent precies één keer uitvoeren
    # - "100:50 say %player% is cheating"
    # Uitvoeren wanneer de gebruiker flag 100 raakt, en daarna elke 50e flag na 100
    #
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
      - "40:0 kick %player% AethelAC: Movement simulation failed"
      - "70:0 ban %player% 30d AethelAC: Movement simulation (%vl% violations)"
  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "30:0 [webhook]"
      - "30:0 [proxy]"
      - "30:0 kick %player% AethelAC: Knockback violation"
      - "60:0 ban %player% 30d AethelAC: Knockback (%vl% violations)"
  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "40:0 kick %player% AethelAC: Post violation"
      - "70:0 ban %player% 30d AethelAC: Post (%vl% violations)"
  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
      - "PhantomBreak"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "20:0 kick %player% AethelAC: Invalid packet"
      - "40:0 ban %player% 30d AethelAC: Bad packets (%vl% violations)"
  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Reach violation"
      - "50:0 ban %player% 30d AethelAC: Reach (%vl% violations)"
  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Hitbox violation"
      - "50:0 ban %player% 30d AethelAC: Hitboxes (%vl% violations)"
  Fingerprint:
    remove-violations-after: 600
    checks:
      - "Fingerprint"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:5 [webhook]"
      - "5:5 [proxy]"
      - "15:0 kick %player% AethelAC: Known cheat client fingerprint"
      - "30:0 ban %player% 30d AethelAC: Known cheat client (%vl% fingerprint violations)"
  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "IdleAutomation"
      - "FastClick"
      - "DamageReaction"
      - "AutoToolChain"
      - "DropBurst"
      - "PackSpoof"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "FireworkCadence"
      - "AutoFish"
      - "SwapAttack"
      - "TriggerBot"
      - "CloseSpoof"
      - "JumpCadence"
      - "PearlSwap"

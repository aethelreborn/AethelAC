# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)

Punishments:
  Simulation:
    # After how many seconds should a violation be removed?
    remove-violations-after: 300
    # This section will match all checks with the name,
    # To exclude a check that would otherwise be matched, put an exclamation mark in front of the name
    # For example, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Threshold:Interval Command
    #
    # N is the active violation count required to run the command.
    # Active violations are counted inside the remove-violations-after window.
    # M > 0 runs at N, then N+M, N+2M, ...
    # M = 0 runs once when N is reached.
    #
    # Examples:
    # - "100:0 kick %player% incorrect movement!"   fires once on flag 100
    # - "100:50 say %player% is cheating"           fires on flags 100, 150, 200, ...
    # - "5:3 [alert]"                               fires on flags 5, 8, 11, 14, ...
    #
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
      - "40:0 kick %player% AethelAC: Movement simulation failed"
      - "70:0 ban %player% 30d AethelAC: Movement simulation (%vl% violations)"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "30:0 [webhook]"
      - "30:0 [proxy]"
      - "30:0 kick %player% AethelAC: Knockback violation"
      - "60:0 ban %player% 30d AethelAC: Knockback (%vl% violations)"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "40:0 kick %player% AethelAC: Post violation"
      - "70:0 ban %player% 30d AethelAC: Post (%vl% violations)"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "20:0 kick %player% AethelAC: Invalid packet"
      - "40:0 ban %player% 30d AethelAC: Bad packets (%vl% violations)"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Reach violation"
      - "50:0 ban %player% 30d AethelAC: Reach (%vl% violations)"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Hitbox violation"
      - "50:0 ban %player% 30d AethelAC: Hitboxes (%vl% violations)"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "30:10 [webhook]"
      - "30:10 [proxy]"
      - "60:0 kick %player% AethelAC: Misc violation"
      - "100:0 ban %player% 30d AethelAC: Misc violations (%vl%)"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Combat violation"
      - "140:0 ban %player% 30d AethelAC: Combat violations (%vl%)"
  # As of 2.2.10, there are no AutoClicker checks and this is a placeholder. Aethel will include AutoClicker checks in the future.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Autoclicker violation"
      - "140:0 ban %player% 30d AethelAC: Autoclicker (%vl%)"

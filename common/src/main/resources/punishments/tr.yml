      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "IdleAutomation"
      - "FastClick"
      - "DamageReaction"
      - "AutoToolChain"
      - "DropBurst"
      - "Break"
      - "TransactionOrder"

# %check_name% - 检查名称
# %description% - 检查的介绍
# %vl% - 违规
# %verbose% - 额外信息
# %player% - 玩家名字
# [alert] - 警告的特殊命令
# [webhook] - 警告discord webhook 的特殊命令
# [proxy] - 用于使用(BungeeCord/Velocity)服务器时的警报
Punishments:
  Simulation:
    # 多少秒后重置VL
    remove-violations-after: 600
    # 这个部分将会匹配检查的名字
    # 要关闭掉一个检查就在检查前面加感叹号
    # 例如, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # 最大vl:下一次执行需要的vl
    #
    # 这是个例子, 当到达100VL时为了以 "incorrect movement!" 为理由踢出玩家
    # commands:
    # - "100:0 kick %player% incorrect movement!"
    # 后面的数如果使用0就代表只执行一次
    # - "100:50 say %player% is cheating"
    # 在100vl后执行say %player% is cheating,之后的每50vl都执行一次say %player% is cheating
    #
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
      - "40:0 kick %player% AethelAC: Movement simulation failed"
      - "70:0 ban %player% 30d AethelAC: Movement simulation (%vl% violations)"
  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "30:0 [webhook]"
      - "30:0 [proxy]"
      - "30:0 kick %player% AethelAC: Knockback violation"
      - "60:0 ban %player% 30d AethelAC: Knockback (%vl% violations)"
  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "40:0 kick %player% AethelAC: Post violation"
      - "70:0 ban %player% 30d AethelAC: Post (%vl% violations)"
  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
      - "PhantomBreak"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "20:0 kick %player% AethelAC: Invalid packet"
      - "40:0 ban %player% 30d AethelAC: Bad packets (%vl% violations)"
  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Reach violation"
      - "50:0 ban %player% 30d AethelAC: Reach (%vl% violations)"
  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Hitbox violation"
      - "50:0 ban %player% 30d AethelAC: Hitboxes (%vl% violations)"
  Fingerprint:
    remove-violations-after: 600
    checks:
      - "Fingerprint"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:5 [webhook]"
      - "5:5 [proxy]"
      - "15:0 kick %player% AethelAC: Known cheat client fingerprint"
      - "30:0 ban %player% 30d AethelAC: Known cheat client (%vl% fingerprint violations)"
  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "IdleAutomation"
      - "FastClick"
      - "DamageReaction"
      - "AutoToolChain"
      - "DropBurst"
      - "PackSpoof"
      - "Break"
      - "SubTickBreak"
      - "NoBreakDelay"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "FireworkCadence"
      - "AutoFish"
      - "SwapAttack"
      - "TriggerBot"
      - "CloseSpoof"
      - "JumpCadence"
      - "JumpReset"
      - "PearlSwap"
      - "InvWalk"
      - "AutoBlock"
      - "AirPlace"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "30:10 [webhook]"
      - "30:10 [proxy]"
      - "60:0 kick %player% AethelAC: Misc violation"
      - "100:0 ban %player% 30d AethelAC: Misc violations (%vl%)"
  AimHeuristics:
    remove-violations-after: 600
    checks:
      - "LinearRotation"
      - "RotationDecay"
      - "AttackRotation"
      - "ReturnFlick"
      - "NoSwingAttack"
      - "SilentAim"
      - "Accuracy"
      - "HiddenAim"
      - "RotationGrid"
      - "TrackingLock"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "60:0 kick %player% AethelAC: Machine-constant rotation"
      - "120:0 ban %player% 30d AethelAC: Machine-constant rotation (%vl% violations)"
  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
      - "MaceSmash"
      - "CrystalCadence"
      - "AnchorCadence"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Combat violation"
      - "140:0 ban %player% 30d AethelAC: Combat violations (%vl%)"
  # Aethel2.0.10版本 没有连点器检查，Aethel将在未来添加
  Autoclicker:
    remove-violations-after: 600
    checks:
      - "Autoclicker"
      - "SlowCadence"
      - "UniformClick"
      - "SubTickClick"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Autoclicker violation"
      - "140:0 ban %player% 30d AethelAC: Autoclicker (%vl%)"

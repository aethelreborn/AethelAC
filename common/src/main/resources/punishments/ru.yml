# %check_name% - название проверки
# %description% - description of the check
# %vl% - нарушения
# %verbose% - дополнительная информация
# %player% - имя игрока
# [alert] - специальная команда для оповещения
# [webhook] - специальная команда для оповещения на discord webhook
# [proxy] - специальная команда для оповещения других серверов, подключенных к вашему прокси (BungeeCord/Velocity)
Punishments:
  Simulation:
    # Через сколько секунд нарушение должно быть удалено?
    remove-violations-after: 600
    # Этот раздел будет соответствовать всем проверкам с указанным именем,
    # Чтобы исключить проверку, которая в противном случае была бы найдена, поставьте восклицательный знак перед именем.
    # Например, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Порог:Интервальная команда
    #
    # Пример, чтобы выгнать игрока с сообщением "неправильное движение!" после 100 нарушений, без интервала
    # Команды:
    # - "100:0 kick %player% неправильное движение!"
    # 0 означает выполнить ровно один раз.
    # - "100:50 say %player% читерит!"
    # Выполняется, когда пользователь получает флаг 100, и после этого каждый 50-й флаг после 100.
    #
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
      - "40:0 kick %player% AethelAC: Movement simulation failed"
      - "70:0 ban %player% 30d AethelAC: Movement simulation (%vl% violations)"
  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "30:0 [webhook]"
      - "30:0 [proxy]"
      - "30:0 kick %player% AethelAC: Knockback violation"
      - "60:0 ban %player% 30d AethelAC: Knockback (%vl% violations)"
  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "40:0 kick %player% AethelAC: Post violation"
      - "70:0 ban %player% 30d AethelAC: Post (%vl% violations)"
  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
      - "PhantomBreak"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "20:0 kick %player% AethelAC: Invalid packet"
      - "40:0 ban %player% 30d AethelAC: Bad packets (%vl% violations)"
  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Reach violation"
      - "50:0 ban %player% 30d AethelAC: Reach (%vl% violations)"
  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Hitbox violation"
      - "50:0 ban %player% 30d AethelAC: Hitboxes (%vl% violations)"
  Fingerprint:
    remove-violations-after: 600
    checks:
      - "Fingerprint"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:5 [webhook]"
      - "5:5 [proxy]"
      - "15:0 kick %player% AethelAC: Known cheat client fingerprint"
      - "30:0 ban %player% 30d AethelAC: Known cheat client (%vl% fingerprint violations)"
  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "IdleAutomation"
      - "FastClick"
      - "DamageReaction"
      - "AutoToolChain"
      - "DropBurst"
      - "PackSpoof"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "FireworkCadence"
      - "AutoFish"
      - "SwapAttack"
      - "TriggerBot"
      - "CloseSpoof"
      - "JumpCadence"
      - "PearlSwap"
      - "InvWalk"
      - "AirPlace"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "30:10 [webhook]"
      - "30:10 [proxy]"
      - "60:0 kick %player% AethelAC: Misc violation"
      - "100:0 ban %player% 30d AethelAC: Misc violations (%vl%)"
  AimHeuristics:
    remove-violations-after: 600
    checks:
      - "LinearRotation"
      - "RotationDecay"
      - "AttackRotation"
      - "ReturnFlick"
      - "NoSwingAttack"
      - "SilentAim"
      - "Accuracy"
      - "HiddenAim"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "60:0 kick %player% AethelAC: Machine-constant rotation"
      - "120:0 ban %player% 30d AethelAC: Machine-constant rotation (%vl% violations)"
  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
      - "MaceSmash"
      - "CrystalCadence"
      - "AnchorCadence"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Combat violation"
      - "140:0 ban %player% 30d AethelAC: Combat violations (%vl%)"
  # Начиная с версии 2.2.10, проверки на AutoClicker отсутствуют, на их месте пока используется placeholder. Aethel будет включать проверки AutoClicker в будущем.

# %check_name% - nombre de la comprobación
# %description% - description of the check
# %vl% - violaciones
# %verbose% - informacion extra
# %player% - nombre del jugador
# [alert] - comando especial para alertar
# [webhook] - comando especial para alertar mediante un webhook de Discord
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)
Punishments:
  Simulation:
    # ¿Después de cuantos segundos deberíamos quitar una violación?
    remove-violations-after: 600
    # Esta sección incluirá todas las comprobaciones con el nombre
    # Para excluir una comprobación que de otro modo coincidiría, pon un signo de exclamación en frente del nombre
    # Por ejemplo: !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Límite:Intervalo Comando
    #
    # Por ejemplo, para expulsar al jugador con el mensaje "movimiento incorrecto!" después de 100 violaciones sin intervalo:
    # commands:
    # - "100:0 kick %player% movimiento incorrecto!"
    # 0 significa ejecutar exactamente una vez
    # - "100:50 say %player% is cheating"
    # Ejecutar cuando el jugador alcance el indicador número 100, y después de eso, cada 50 indicadores después de 100
    #
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
      - "40:0 kick %player% AethelAC: Movement simulation failed"
      - "70:0 ban %player% 30d AethelAC: Movement simulation (%vl% violations)"
  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "30:0 [webhook]"
      - "30:0 [proxy]"
      - "30:0 kick %player% AethelAC: Knockback violation"
      - "60:0 ban %player% 30d AethelAC: Knockback (%vl% violations)"
  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "40:0 kick %player% AethelAC: Post violation"
      - "70:0 ban %player% 30d AethelAC: Post (%vl% violations)"
  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "20:0 kick %player% AethelAC: Invalid packet"
      - "40:0 ban %player% 30d AethelAC: Bad packets (%vl% violations)"
  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Reach violation"
      - "50:0 ban %player% 30d AethelAC: Reach (%vl% violations)"
  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Hitbox violation"
      - "50:0 ban %player% 30d AethelAC: Hitboxes (%vl% violations)"
  Fingerprint:
    remove-violations-after: 600
    checks:
      - "Fingerprint"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:5 [webhook]"
      - "5:5 [proxy]"
      - "15:0 kick %player% AethelAC: Known cheat client fingerprint"
      - "30:0 ban %player% 30d AethelAC: Known cheat client (%vl% fingerprint violations)"
  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "30:10 [webhook]"
      - "30:10 [proxy]"
      - "60:0 kick %player% AethelAC: Misc violation"
      - "100:0 ban %player% 30d AethelAC: Misc violations (%vl%)"
  AimHeuristics:
    remove-violations-after: 600
    checks:
      - "LinearRotation"
      - "RotationDecay"
      - "AttackRotation"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "60:0 kick %player% AethelAC: Machine-constant rotation"
      - "120:0 ban %player% 30d AethelAC: Machine-constant rotation (%vl% violations)"
  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Combat violation"
      - "140:0 ban %player% 30d AethelAC: Combat violations (%vl%)"
  # A partir de 2.2.10, no hay ninguna comprobación de AutoClicker y esto es un placeholder.
  # Aethel incluirá revisiones de AutoClicker en el futuro.
  Autoclicker:
    remove-violations-after: 600
    checks:
      - "Autoclicker"
      - "SlowCadence"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Autoclicker violation"
      - "140:0 ban %player% 30d AethelAC: Autoclicker (%vl%)"

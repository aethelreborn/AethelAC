# %check_name% – チェックの名前
# %description% - チェックの説明
# %vl% - 違反回数
# %verbose% - 追加情報
# %player% - プレイヤー名
# [alert] - アラート通知を行う特別なコマンド
# [webhook] - DiscordのWebhookに通知する特別なコマンド
# [proxy] - プロキシに接続された他のサーバーに通知する特別なコマンド（BungeeCord/Velocity用）
Punishments:
  Simulation:
    # 何秒後に違反をリセットしますか？
    remove-violations-after: 600
    # このセクションでは、指定した名前と一致するすべてのチェックに対して処罰を設定します
    # 一部のチェックを除外するには、名前の前に「!」を付けます
    # 例: !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # しきい値:間隔 コマンド
    #
    # 例: 100回の違反で「incorrect movement!」と表示しプレイヤーをキックする場合
    # commands:
    # - "100:0 kick %player% incorrect movement!"
    # 0は一度だけ実行されることを意味します
    # - "100:50 say %player% is cheating"
    # 100回違反が発生した際に実行し、その後100回以降は50回ごとに実行されます
    #
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
      - "40:0 kick %player% AethelAC: Movement simulation failed"
      - "70:0 ban %player% 30d AethelAC: Movement simulation (%vl% violations)"
  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "30:0 [webhook]"
      - "30:0 [proxy]"
      - "30:0 kick %player% AethelAC: Knockback violation"
      - "60:0 ban %player% 30d AethelAC: Knockback (%vl% violations)"
  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "40:0 kick %player% AethelAC: Post violation"
      - "70:0 ban %player% 30d AethelAC: Post (%vl% violations)"
  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
      - "PhantomBreak"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "20:0 kick %player% AethelAC: Invalid packet"
      - "40:0 ban %player% 30d AethelAC: Bad packets (%vl% violations)"
  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Reach violation"
      - "50:0 ban %player% 30d AethelAC: Reach (%vl% violations)"
  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "10:5 [proxy]"
      - "25:0 kick %player% AethelAC: Hitbox violation"
      - "50:0 ban %player% 30d AethelAC: Hitboxes (%vl% violations)"
  Fingerprint:
    remove-violations-after: 600
    checks:
      - "Fingerprint"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:5 [webhook]"
      - "5:5 [proxy]"
      - "15:0 kick %player% AethelAC: Known cheat client fingerprint"
      - "30:0 ban %player% 30d AethelAC: Known cheat client (%vl% fingerprint violations)"
  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "IdleAutomation"
      - "FastClick"
      - "DamageReaction"
      - "AutoToolChain"
      - "DropBurst"
      - "PackSpoof"
      - "Break"
      - "SubTickBreak"
      - "NoBreakDelay"
      - "PingSpoof"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "FireworkCadence"
      - "AutoFish"
      - "SwapAttack"
      - "TriggerBot"
      - "CloseSpoof"
      - "JumpCadence"
      - "JumpReset"
      - "PearlSwap"
      - "InvWalk"
      - "AutoBlock"
      - "AirPlace"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "30:10 [webhook]"
      - "30:10 [proxy]"
      - "60:0 kick %player% AethelAC: Misc violation"
      - "100:0 ban %player% 30d AethelAC: Misc violations (%vl%)"
  AimHeuristics:
    remove-violations-after: 600
    checks:
      - "LinearRotation"
      - "RotationDecay"
      - "AttackRotation"
      - "ReturnFlick"
      - "NoSwingAttack"
      - "SilentAim"
      - "Accuracy"
      - "HiddenAim"
      - "RotationGrid"
      - "TrackingLock"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "60:0 kick %player% AethelAC: Machine-constant rotation"
      - "120:0 ban %player% 30d AethelAC: Machine-constant rotation (%vl% violations)"
  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
      - "MaceSmash"
      - "CrystalCadence"
      - "AnchorCadence"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Combat violation"
      - "140:0 ban %player% 30d AethelAC: Combat violations (%vl%)"
  # バージョン2.2.10時点では、AutoClickerのチェックはまだなく、これはプレースホルダーです。Aethelは将来的にAutoClickerのチェックを追加予定です。
  Autoclicker:
    remove-violations-after: 600
    checks:
      - "Autoclicker"
      - "SlowCadence"
      - "UniformClick"
      - "SubTickClick"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "40:20 [webhook]"
      - "40:20 [proxy]"
      - "80:0 kick %player% AethelAC: Autoclicker violation"
      - "140:0 ban %player% 30d AethelAC: Autoclicker (%vl%)"

alerts:
    # In addition to broadcasting alerts to players, should they also be sent to the console?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: true
        # Should the alerts received from other servers be announced to this server?
        receive: true

verbose:
    print-to-console: true

check-for-updates: false

client-brand:
    # This means it won't broadcast their brand to operators if the brand matches the following regexes
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Aethel will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

client-fingerprint:
    # Substrings matched case-insensitively against the client brand packet.
    # A match flags the Fingerprint check. Keep this list to known cheat clients.
    brands:
        - "wurst"
        - "meteor"
        - "sigma"
        - "impact"
        - "future"
        - "salhack"
        - "konas"
        - "novoline"
        - "astolfo"
        - "aristois"
        - "bleachhack"
        - "lambda"
        - "aethelclient"
        - "tru3club"
    # Substrings matched case-insensitively against channels registered by the
    # client (minecraft:register payload). A match flags the Fingerprint check.
    channels:
        - "wurst:"
        - "meteor-client:"
        - "bleachhack:"
        - "aethelclient"
        - "tru3club"
        - "impact"
        - "future:"
        - "konas"
        - "novoline"
        - "sigma"
        - "salhack"
        - "lambda"

attack-patterns:
    # Autoclicker detection (sustained attacks per second within the window).
    # 18 CPS across a full minute or 20 CPS across 20 seconds is beyond
    # sustained human clicking; raise these on drag-click-heavy 1.8 servers.
    cps60-threshold: 18.0
    cps20-threshold: 20.0
    # Coefficient of variation below which 100+ consecutive attack intervals
    # at an elevated click rate count as machine cadence.
    cadence-cv-threshold: 0.06
    # Sustained clicking above this rate that never produces a sub-burst-gap
    # interval counts as machine cadence (humans burst at high CPS).
    no-burst-min-cps: 14.0
    burst-gap-ms: 35.0
    # Slow-cadence metronome detection (SlowCadence check): sample count,
    # coefficient-of-variation ceiling and maximum interval in milliseconds.
    metronome-samples: 48
    metronome-cv: 0.05
    metronome-max-interval: 400
    # Steady-band cadence detection (SlowCadence "steady" tier): long sample
    # count and looser variation ceiling for randomized-delay triggerbots.
    steady-samples: 100
    steady-cv: 0.08
    # Rotating-attack detection (AttackRotation check): lookback window in
    # seconds, minimum attacks in window, required rotating fraction and the
    # per-tick rotation delta in degrees that counts as rotating.
    rotating-window-seconds: 60
    rotating-min-attacks: 12
    rotating-fraction: 0.8
    rotating-min-delta: 20.0
    # Attack-anchored return detection (ReturnFlick check): minimum rotation
    # burst in degrees before an attack, minimum return magnitude ratio,
    # endpoint tolerance relative to the burst, attacks required in the
    # lookback window and the required returned fraction.
    return-approach-min: 6.0
    return-ratio-min: 0.6
    return-endpoint-tolerance: 0.35
    return-window-attacks: 12
    return-window-seconds: 20
    return-fraction: 0.6
    # No-swing aura detection (NoSwingAttack check): how stale the last arm
    # animation may be for an attack to count as swung, and how many
    # unswung attacks in a row trigger a flag.
    swing-max-age-ms: 200
    swing-miss-attacks: 4

aim-analysis:
    # Machine-constant rotation detection (LinearRotation check): coefficient
    # of variation ceiling across 15 consecutive combat-speed rotation ticks.
    linear-cv-threshold: 0.05
    linear-min-speed: 3.0
    yaw-cv-threshold: 0.05
    yaw-min-speed: 2.0
    pitch-cv-threshold: 0.06
    pitch-min-speed: 0.8
    # Rotation decay detection (RotationDecay check): ratio band and maximum
    # spread of consecutive delta ratios, minimum starting speed in deg/tick.
    decay-ratio-min: 0.30
    decay-ratio-max: 0.995
    decay-ratio-spread: 0.06
    decay-min-start: 6.0

idle-automation:
    # Anti-AFK automation detection (IdleAutomation check): a player who only
    # performs sparse idle actions (jump/swing) for this many seconds without
    # any rotation, movement or interaction. Minimum event count, average
    # interval band in seconds and the stillness window in milliseconds.
    window-seconds: 180
    min-events: 8
    min-interval-seconds: 3.0
    max-interval-seconds: 15.0
    stillness-milliseconds: 2000

inventory-automation:
    # Container click-rate detection (FastClick check): window in seconds,
    # minimum pickup/shift-move clicks in the window and the mean interval in
    # milliseconds below which the cadence is superhuman.
    click-window-seconds: 10
    click-min-count: 60
    click-mean-interval-ms: 110.0
    # Hotbar tool automation detection (AutoToolChain check): lookback window
    # in seconds, minimum swap cycles and the mean turnaround ceiling in ms.
    tool-swap-window-seconds: 60
    tool-swap-min-cycles: 6
    tool-swap-mean-turnaround-ms: 400.0
    # Drop-everything macro detection (DropBurst check): lookback window in
    # seconds and the minimum burst size that triggers a flag.
    drop-window-seconds: 1
    drop-min-count: 12

reaction-analysis:
    # Damage reaction detection (DamageReaction check): maximum single
    # reaction in ms, mean reaction ceiling, minimum sample pairs and the
    # lookback window in seconds.
    damage-reaction-max-ms: 300.0
    damage-reaction-mean-ms: 120.0
    damage-reaction-min-pairs: 6
    damage-reaction-window-seconds: 300

shadow-checks:
    # Checks listed here only send staff alerts and database logs. Webhook and
    # proxy broadcasts, console commands, kicks and bans are suppressed, so new
    # heuristic checks can be staged before enforcing. Substring matching, e.g.
    # "linearrotation" or "autoclicker". A single empty entry disables it.
    - ""

spectators:
    # Hide all spectators with the aethel.spectate permission regardless if they are actually actively spectating
    hide-regardless: false
    # Will make spectators hidden only in these worlds, keep blank to allow all worlds
    allowed-worlds:
        - ""

# How long should players have until we kick them for timing out? Default = 60 seconds
max-transaction-time: 30

# Enable this to stop Aethel cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Should the default block resynchronization handler be disabled?
# By default, Aethel reads blocks from the server world and sends them to the client to fix desync.
# If you use plugins that create fake packet-based blocks (which don't exist in the server world),
# you should set this to true to prevent Aethel from overwriting them with air/real blocks.
# This forces the use of a "NoOp" (No Operation) handler unless a custom one is provided via API.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # How much should we multiply total advantage by when the player is legit
    # This is what the default config looks like (x axis = seconds, y axis = 1/1000 block): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.9998
    # How large of an offset from the player's movement should we create a violation for?
    # Measured in blocks from the possible movement
    # We account for Optifine by switching trig tables but dropping this to 0.001 will reduce FastMath
    # flagging the anticheat if this compensation doesn't work...
    threshold: 0.0005
    # How large of a violation in a tick before the player gets immediately setback?
    # -1 to disable
    immediate-setback-threshold: 0.02
    # How large of an advantage over all ticks before we start to setback?
    # -1 to disable
    max-advantage: 0.5
    # After 50 seconds with default config, the player will go from 4 blocks -> 1 block of advantage
    # This is to stop the player from gathering too many violations and never being able to clear them all
    # Default advantage ceiling (x axis = seconds, y axis = 1/1000 block): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 2
    # Violation level threshold for setback
    # 1 for old behavior
    setback-violation-threshold: 1

# Checks to see if a player entered a block during a movement
Phase:
    setbackvl: 1 # Glitching into blocks can allow wall climbing, plus this check is relatively stable
    decay: 0.001

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 1

FarPlace:
    cancelvl: 1

PositionPlace:
    cancelvl: 1

RotationPlace:
    cancelvl: 1

# Prediction-based no slow check
# Aethel accounts for buggy netcode here... hard to false even when spamming right click and offhand button
# Much more stable than other anticheats, but please report any falses... I have fixed a ton of netcode issues here.
NoSlow:
    # How much of an offset is "cheating"
    # By default this is lower than other offs
    # Flags by 0.03-0.2 consistently with NoSlow on
    threshold: 0.0005
    # Setback fast on the first item to remove any advantage NoSlow gives
    setbackvl: 2
    # Decay's when the player uses an item AND is slowed by it
    decay: 0.02

Knockback:
    # How much should we multiply total advantage by when the player is legit
    setback-decay-multiplier: 0.9998
    # How large of an offset from the player's velocity should we create a violation for?
    # Measured in blocks from the possible velocity
    threshold: 0.001
    # How large of a violation in a tick before the player gets immediately setback?
    # -1 to disable
    immediate-setback-threshold: 0.02
    # How large of an advantage over all ticks before we start to setback?
    # -1 to disable
    max-advantage: 0.5
    # This is to stop the player from gathering too many violations and never being able to clear them all
    max-ceiling: 2

Explosion:
    threshold: 0.001
    setbackvl: 1

TimerA:
    setbackvl: 5
    # Milliseconds that the player can accumulate for later use when they fall behind
    # Could potentially allow 1.8 fast use/fast heal/fast bow bypasses if set too high, 120 ms seems like a good balance
    drift: 60

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 250

NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 500

# Same check method as TimerA, but for vehicles
VehicleTimer:
    # Target 1.005 timer
    setbackvl: 2

PacketOrderI:
    # enable if players are getting flagged for using 1.7 animations mods
    exempt-placing-while-digging: false

Reach:
    # How much should we expand hitboxes by? 0.0005 should detect 3.0005+ reach
    #
    # There is 0.03 forced expansion with 1.9-1.18.1 (not 1.18.2), or some client/server combinations due to
    # protocol changes and limitations. This check is most powerful with 1.7/1.8 clients on 1.8 servers.
    threshold: 0.0001
    # Should we cancel hits that we know are impossible?
    # 3.00-3.03 hits may go through but still be flagged, due to packet order limitations
    block-impossible-hits: true
    # This will send an additional packet at the end of every tick to increase the likelihood of catching cheats
    # This injects into server's connection list to send a final packet just before the server flushes
    # Enabling this will increase bandwidth usage for all players
    # This will not decrease overall server performance
    # Enabling this will catch more cheaters.
    # Leaving this disabled will still catch cheaters and will not cause false positives
    # Unless you are a 1.8 PvP focused server, this additional packet is not recommended
    enable-post-packet: true

exploit:
    # You can gain high speeds when sprint jumping with an elytra, this prevents the exploit when set to false
    # Mojang screwed up netcode by making elytra start client sided and elytra end server sided
    # Elytras take 0.99 horizontal friction, so constantly adding 0.2 horizontal speeds results in very high speeds.
    allow-sprint-jumping-when-using-elytra: false
    # This option mitigates the player's placement on ghostblocks by resynchronizing the player when it happens
    allow-building-on-ghostblocks: false
    # This setting, influenced by the boolean above defines the distance to check for ghost blocks
    # Its valid range is limited from 2 to 4
    distance-to-check-if-ghostblocks: 2

# Enable logging plugins who have injected into netty on join to debug compatibility issues
debug-pipeline-on-join: false

# Enables experimental checks
experimental-checks: true

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Aethel sometimes cancels illegal packets such as with timer, after X packets in a second cancelled, when should
# we simply kick the player? This is required as some packet limiters don't count packets cancelled by Aethel.
packet-spam-threshold: 30
# Enable this to print a stacktrace when a player is kicked due to packet-spam-threshold
debug-packet-cancel: false

# Aethel is able to enforce that a player set out of flying state cannot have more than X milliseconds of ping
# This is due to Aethel not currently checking flying players
# To disable, use -1
max-ping-out-of-flying: 200

# Maximum ping when a firework boost is removed from the player.
# This prevents high latency players from being able to use 1 firework boost with an elytra forever.
max-ping-firework-boost: 350

# Aethel always refreshes cached permissions when a player joins and when Aethel reloads,
# whether or not LuckPerms is installed.
# LuckPerms event hooks also refresh cached Aethel permissions immediately in normal setups.
# This periodic fallback is only needed for online permission changes not covered by
# those events, such as a custom LuckPerms context that does not call signalContextUpdate,
# Fabric context gaps, or a non-LuckPerms permission provider that changes live.
# Set to -1 to disable polling. Set to a positive value to refresh every X ticks.
update-permission-ticks: 20

# Schema markers — touch only if you know what you're doing.
#   config-flavor:  V2 = Aethel 2.x build, V3 = Aethel 3.x. The plugin refuses
#                   to load a config whose flavor doesn't match its own
#                   build, so a V3 config opened by a V2 jar fails fast
#                   instead of silently flat-merging into the wrong keys.
#   config-version: bumped on every breaking shape change. Old configs
#                   auto-migrate up via the bundled updater on next start.
config-flavor: V2
config-version: 27

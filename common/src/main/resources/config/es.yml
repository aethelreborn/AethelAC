# La configuración principal de AethelAC
# Código fuente: https://github.com/aethelreborn/AethelAC
# Copyright 2025 DefineOutside y contribuyentes, licenciado bajo GPLv3.
# Binarios modificados o plugins con código de AethelAC deben ser privados o con
# el código fuente disponible para todos los compradores sin costo adicional.

alerts:
    # ¿Además de mandar las alertas a los jugadores, deberíamos mandarlas también a la consola?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: true
        # Should the alerts received from other servers be announced to this server?
        receive: true

verbose:
    print-to-console: true

check-for-updates: false

client-brand:
    # Esto quiere decir que no se va a anunciar la marca del cliente si esta cumple alguno de los siguientes regexes:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Aethel will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

client-fingerprint:
    # Substrings matched case-insensitively against the client brand packet.
    # A match flags the Fingerprint check. Keep this list to known cheat clients.
    brands:
        - "wurst"
        - "meteor"
        - "sigma"
        - "impact"
        - "future"
        - "salhack"
        - "konas"
        - "novoline"
        - "astolfo"
        - "aristois"
        - "bleachhack"
        - "lambda"
        - "aethelclient"
        - "tru3club"
    # Substrings matched case-insensitively against channels registered by the
    # client (minecraft:register payload). A match flags the Fingerprint check.
    channels:
        - "wurst:"
        - "meteor-client:"
        - "bleachhack:"
        - "aethelclient"
        - "tru3club"
        - "impact"
        - "future:"
        - "konas"
        - "novoline"
        - "sigma"
        - "salhack"
        - "lambda"

attack-patterns:
    # Autoclicker detection (sustained attacks per second within the window).
    # 18 CPS across a full minute or 20 CPS across 20 seconds is beyond
    # sustained human clicking; raise these on drag-click-heavy 1.8 servers.
    cps60-threshold: 18.0
    cps20-threshold: 20.0
    # Coefficient of variation below which 100+ consecutive attack intervals
    # at an elevated click rate count as machine cadence.
    cadence-cv-threshold: 0.06
    # Sustained clicking above this rate that never produces a sub-burst-gap
    # interval counts as machine cadence (humans burst at high CPS).
    no-burst-min-cps: 14.0
    burst-gap-ms: 35.0
    # Slow-cadence metronome detection (SlowCadence check): sample count,
    # coefficient-of-variation ceiling and maximum interval in milliseconds.
    metronome-samples: 48
    metronome-cv: 0.05
    metronome-max-interval: 400
    # Steady-band cadence detection (SlowCadence "steady" tier): long sample
    # count and looser variation ceiling for randomized-delay triggerbots.
    steady-samples: 100
    steady-cv: 0.08
    # Rotating-attack detection (AttackRotation check): lookback window in
    # seconds, minimum attacks in window, required rotating fraction and the
    # per-tick rotation delta in degrees that counts as rotating.
    rotating-window-seconds: 60
    rotating-min-attacks: 12
    rotating-fraction: 0.8
    rotating-min-delta: 20.0
    # Attack-anchored return detection (ReturnFlick check): minimum rotation
    # burst in degrees before an attack, minimum return magnitude ratio,
    # endpoint tolerance relative to the burst, attacks required in the
    # lookback window and the required returned fraction.
    return-approach-min: 6.0
    return-ratio-min: 0.6
    return-endpoint-tolerance: 0.35
    return-window-attacks: 12
    return-window-seconds: 20
    return-fraction: 0.6
    # No-swing aura detection (NoSwingAttack check): how stale the last arm
    # animation may be for an attack to count as swung, and how many
    # unswung attacks in a row trigger a flag.
    swing-max-age-ms: 200
    swing-miss-attacks: 4
    # Mace smash-timing detection (MaceSmash check): minimal smash fall
    # window, how many recent smash attacks to judge, and the fraction that
    # must sit inside the window to flag.
    mace-band-min: 1.5
    mace-band-max: 1.7
    mace-min-attacks: 10
    mace-band-fraction: 0.9

aim-analysis:
    # Machine-constant rotation detection (LinearRotation check): coefficient
    # of variation ceiling across 15 consecutive combat-speed rotation ticks.
    linear-cv-threshold: 0.05
    linear-min-speed: 3.0
    yaw-cv-threshold: 0.05
    yaw-min-speed: 2.0
    pitch-cv-threshold: 0.06
    pitch-min-speed: 0.8
    # Rotation decay detection (RotationDecay check): ratio band and maximum
    # spread of consecutive delta ratios, minimum starting speed in deg/tick.
    decay-ratio-min: 0.18
    decay-ratio-max: 0.995
    decay-ratio-spread: 0.06
    decay-min-start: 6.0

idle-automation:
    # Anti-AFK automation detection (IdleAutomation check): a player who only
    # performs sparse idle actions (jump/swing) for this many seconds without
    # any rotation, movement or interaction. Minimum event count, average
    # interval band in seconds and the stillness window in milliseconds.
    window-seconds: 180
    min-events: 8
    min-interval-seconds: 3.0
    max-interval-seconds: 15.0
    stillness-milliseconds: 2000

inventory-automation:
    # Container click-rate detection (FastClick check): window in seconds,
    # minimum pickup/shift-move clicks in the window and the mean interval in
    # milliseconds below which the cadence is superhuman.
    click-window-seconds: 10
    click-min-count: 60
    click-mean-interval-ms: 110.0
    # Menu-bot cadence detection (FastClick second tier): click interval CV
    # ceiling and the mean interval band for GUI navigation bots.
    menu-cadence-cv: 0.045
    menu-min-interval-ms: 250
    menu-max-interval-ms: 900
    # Hotbar tool automation detection (AutoToolChain check): lookback window
    # in seconds, minimum swap cycles and the mean turnaround ceiling in ms.
    tool-swap-window-seconds: 60
    tool-swap-min-cycles: 6
    tool-swap-mean-turnaround-ms: 400.0
    # Drop-everything macro detection (DropBurst check): lookback window in
    # seconds and the minimum burst size that triggers a flag.
    drop-window-seconds: 1
    drop-min-count: 12

reaction-analysis:
    # Damage reaction detection (DamageReaction check): maximum single
    # reaction in ms, mean reaction ceiling, minimum sample pairs and the
    # lookback window in seconds.
    damage-reaction-max-ms: 300.0
    damage-reaction-mean-ms: 120.0
    damage-reaction-min-pairs: 6
    damage-reaction-window-seconds: 300

elytra-analysis:
    # Firework cadence detection (FireworkCadence check): how many boost
    # intervals to judge, the interval CV ceiling, and the mean interval band.
    firework-min-intervals: 8
    firework-cadence-cv: 0.05
    firework-mean-min-ms: 700
    firework-mean-max-ms: 4000

pack-spoof:
    # Resource-pack spoof detection (PackSpoof check): acceptance-to-success
    # gap window in ms that machine spoofers land in, and how many fixed-gap
    # reports trigger a flag.
    spoof-min-ms: 293
    spoof-max-ms: 360
    spoof-min-pairs: 2

shadow-checks:
    # Checks listed here only send staff alerts and database logs. Webhook and
    # proxy broadcasts, console commands, kicks and bans are suppressed, so new
    # heuristic checks can be staged before enforcing. Substring matching, e.g.
    # "linearrotation" or "autoclicker". A single empty entry disables it.
    - ""

spectators:
    # Ocultar todos los espectadores con el permiso aethel.spectate sin importar si realmente están espectando
    hide-regardless: false
    # ¿En qué mundos deberíamos ocultar los espectadores? Si está en blanco, se ocultaran en todos los mundos.
    allowed-worlds:
        - ""

# ¿Cuánto tiempo de espera debería pasar antes de expulsar un jugador por "tiempo de espera agotado"?
# Por defecto, este valor se encuentra en 60 segundos.
max-transaction-time: 30

# Enable this to stop Aethel cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# ¿Debería desactivarse el manejador de resincronización de bloques predeterminado?
# Por defecto, Aethel lee los bloques del mundo del servidor y los envía al cliente para corregir la desincronización.
# Si utilizas plugins que crean bloques falsos basados en paquetes (que no existen en el mundo del servidor),
# deberías establecer esto en true para evitar que Aethel los sobrescriba con aire o bloques reales.
# Esto fuerza el uso de un manejador "NoOp" (Sin Operación) a menos que se proporcione uno personalizado vía API.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    # Asi es como se ve la configuración por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.9998
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    # Tomamos en cuenta a OptiFine cambiando las tablas trigonometricas, pero bajar esto a 0.001 reducirá
    # que FastMath marque el anti-cheat si esta compensación no funciona...
    threshold: 0.0005
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.02
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 0.5
    # Después de 50 segundos con la configuración predeterminada, el jugador ira de 4 bloques -> 1 bloque de ventaja
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    # Tope de ventaja por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 2
    # Umbral del nivel de violación para el retroceso
    # 1 para el comportamiento antiguo
    setback-violation-threshold: 1

# Comprobaciones para ver si un jugador entro a un bloque durante un movimiento
Phase:
    setbackvl: 1 # Entrar a un bloque mediante bugs puede permitir subir paredes, además esta comprobación es relativamente estable.
    decay: 0.001

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 1

FarPlace:
    cancelvl: 1

PositionPlace:
    cancelvl: 1

RotationPlace:
    cancelvl: 1

# Comprobación de NoSlow basado en predicciones
# Aethel compensa por código de red con errores aquí... difícil de sacar un falso positivo incluso haciendo spam del
# clic derecho y la mano secundaria.
# Mucho mas estable que otros anti-cheats, pero por favor reportar todo falso positivo... he arreglado muchos
# problemas del código de red aquí.
NoSlow:
    # ¿Cuánta debería ser la compensacion como para que se considere trampa?
    # Por defecto esto es más bajo que otras compensaciones
    # Marca por 0.03-0.2 consistentemente con NoSlow activado
    threshold: 0.0005
    # Retroceder rápidamente en el primer item para eliminar toda ventaja que NoSlow brinde
    setbackvl: 2
    # Decadencia cuando un jugador usa un item Y se ralentiza por el
    decay: 0.02

Knockback:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    setback-decay-multiplier: 0.9998
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.02
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 0.5
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    max-ceiling: 2


Explosion:
    threshold: 0.001
    setbackvl: 1

TimerA:
    setbackvl: 5
    # Milisegundos que el jugador puede acumular para ser usados mas tarde cuando se quedan por detrás
    # Podría llegar a permitir pasos por alto de fast use/fast heal/fast bow en 1.8 si esta muy alto, 120 ms
    # parece ser un balance bastante decente.
    drift: 60

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 250

NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 500

# La misma comprobación que TimerA, pero para vehiculos
VehicleTimer:
    # Target 1.005 timer
    setbackvl: 2

PacketOrderI:
    # Habilitar si los jugadores están siendo marcados por usar mods de animación de la 1.7
    exempt-placing-while-digging: false

Reach:
    # Cuanto deberíamos expandir las hit-boxes? 0.0005 debería detectar un reach de 3.0005+
    #
    # Hay una expansion forzada de 0.03 con 1.9-1.18.1 (1.18.2 no) y algunas combinaciones de clientes/servidores
    # debido a cambios en el protocolo y limitaciones. Esta comprobación es más poderosa en clientes 1.7 y 1.8
    # conectados a un servidor 1.8
    threshold: 0.0001
    # ¿Deberíamos cancelar golpes que sabemos que son imposibles?
    # Golpes de 3.00-3.03 puede que aun asi pasen, pero se marcaran debido a limitaciones del orden de paquetes.
    block-impossible-hits: true
    # Esto mandará un paquete adicional al final de cada tick para aumentar las chances de encontrar trampas
    # Esto se inyecta en la lista de conexiones del servidor para mandar un paquete final justo antes de que el servidor haga "flush".
    # Habilitar esto causará que el uso de banda ancha de todos los jugadores aumente
    # Esto no disminuirá el rendimiento del servidor.
    # Habilitar esto ayudará a encontrar más jugadores haciendo trampa.
    # Dejar esto deshabilitado también encontrara a jugadores haciendo trampa y no causara falsos positivos.
    # Excepto que seas un servidor 1.8 enfocado en el PvP, este paquete adicional no es recomendado.
    enable-post-packet: true

exploit:
    allow-sprint-jumping-when-using-elytra: false
    # Esta opción mitiga la colocación del jugador en bloques fantasma resincronizando al jugador cuando ocurre.
    allow-building-on-ghostblocks: false
    distance-to-check-if-ghostblocks: 2

# Habilitar el registro de plugins que se han inyectado a netty para intentar resolver problemas de compatibilidad.
debug-pipeline-on-join: false

# Habilitar comprobaciones experimentales
experimental-checks: true

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Aethel a veces cancela paquetes ilegal como los de Timer. Después de X paquetes en un solo segundo cancelados,
# cuando deberíamos simplemente expulsar al jugador? Esto es obligatorio ya que algunos limitadores de paquetes
# no cuentan los paquetes cancelados por Aethel.
packet-spam-threshold: 30
# Activa esto para imprimir un stacktrace cuando un jugador sea expulsado por packet-spam-threshold
debug-packet-cancel: false

# Aethel puede hacer cumplir que un jugador que ha salido del estado de vuelo no tenga más de X ms de ping
# Esto se debe a que Aethel actualmente no comprueba a los jugadores que están volando
# Para desactivar, usa -1
max-ping-out-of-flying: 200

# Ping máximo cuando se elimina el impulso de fuegos artificiales del jugador.
# Esto evita que los jugadores con alta latencia puedan usar un solo impulso con fuegos artificiales y una elytra para siempre.
max-ping-firework-boost: 350

# Marcadores de esquema — toca solo si sabes lo que haces.
#   config-flavor:  V2 = build de Aethel 2.x, V3 = Aethel 3.x. El plugin se niega
#                   a cargar una config cuyo flavor no coincida con su propio
#                   build; una config V3 abierta por un jar V2 falla rápido en
#                   vez de fusionarse silenciosamente en claves equivocadas.
#   config-version: se incrementa con cada cambio de forma incompatible. Las
#                   configs antiguas se migran automáticamente con el updater
#                   incluido al siguiente arranque.
# Aethel siempre actualiza los permisos en caché cuando un jugador entra y cuando
# Aethel se recarga, tenga o no LuckPerms instalado.
# Los hooks de eventos de LuckPerms también actualizan inmediatamente los permisos
# de Aethel en caché en configuraciones normales.
# Este respaldo periódico solo es necesario para cambios de permisos en línea no
# cubiertos por esos eventos, como un contexto personalizado de LuckPerms que no
# llame a signalContextUpdate, huecos de contexto en Fabric o un proveedor de
# permisos que no sea LuckPerms y cambie permisos en vivo.
# Usa -1 para desactivar el sondeo. Usa un valor positivo para actualizar cada X ticks.
update-permission-ticks: 20

config-flavor: V2
config-version: 32

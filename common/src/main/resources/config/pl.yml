# AethelAC główna konfiguracja
# Kod źródłowy: https://github.com/aethelreborn/AethelAC
# Prawa autorskie 2025 DefineOutside i współautorzy, licencjonowane na podstawie GPLv3.
# Zmodyfikowane pliki binarne, albo pluginy z skopiowanym kodem AethelAC, muszą być prywatne,
# lub z pełnym kodem źródłowym dostępnym dla kupujących bez dodatkowych kosztów.

alerts:
    # Czy oprócz wysyłania alertów do graczy, powinny być one również wysyłane na konsolę?
    print-to-console: true
    # Określa, czy i w jaki sposób alerty są udostępniane pomiędzy serwerami połączonymi z Twoim serwerem proxy.
    # Jeśli korzystasz z Velocity, musisz włączyć opcję „bungee-plugin-message-channel” w konfiguracji Velocity.
    proxy:
        # Czy alerty powinny być wysyłane do innych serwerów podłączonych do Twojego serwera proxy?
        send: true
        # Czy alerty otrzymywane z innych serwerów powinny być przekazywane temu serwerowi?
        receive: true

verbose:
    print-to-console: true

check-for-updates: false

client-brand:
    # Oznacza to, że nie będzie transmitować swojej marki operatorom, jeśli marka będzie pasować do następujących wyrażeń regularnych.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Aethel umieści na czarnej liście konkretne wersje Forge, które zawierają wbudowane modyfikacje Reach (Forge 1.18.2 do 1.19.3).
    # Ustawienie tej opcji na fałsz umożliwi tym klientom połączenie się z serwerem. Wyłączasz tę opcję na własne ryzyko.
    disconnect-blacklisted-forge-versions: true

client-fingerprint:
    # Substrings matched case-insensitively against the client brand packet.
    # A match flags the Fingerprint check. Keep this list to known cheat clients.
    brands:
        - "wurst"
        - "meteor"
        - "sigma"
        - "impact"
        - "future"
        - "salhack"
        - "konas"
        - "novoline"
        - "astolfo"
        - "aristois"
        - "bleachhack"
        - "lambda"
        - "aethelclient"
        - "tru3club"
    # Substrings matched case-insensitively against channels registered by the
    # client (minecraft:register payload). A match flags the Fingerprint check.
    channels:
        - "wurst:"
        - "meteor-client:"
        - "bleachhack:"
        - "aethelclient"
        - "tru3club"
        - "impact"
        - "future:"
        - "konas"
        - "novoline"
        - "sigma"
        - "salhack"
        - "lambda"

attack-patterns:
    # Autoclicker detection (sustained attacks per second within the window).
    # 18 CPS across a full minute or 20 CPS across 20 seconds is beyond
    # sustained human clicking; raise these on drag-click-heavy 1.8 servers.
    cps60-threshold: 18.0
    cps20-threshold: 20.0
    # Coefficient of variation below which 100+ consecutive attack intervals
    # at an elevated click rate count as machine cadence.
    cadence-cv-threshold: 0.06
    # Sustained clicking above this rate that never produces a sub-burst-gap
    # interval counts as machine cadence (humans burst at high CPS).
    no-burst-min-cps: 14.0
    burst-gap-ms: 35.0
    # Uniformly randomized click detection (UniformClick check): click
    # intervals needed, minimum CPS, the longest interval that keeps the
    # stream alive and the excess-kurtosis ceiling below which a bounded
    # random distribution counts as machine.
    uniform-click-samples: 200
    uniform-click-min-cps: 5.0
    uniform-click-max-interval-ms: 1000.0
    uniform-click-max-kurtosis: 0.5
    # Sub-tick delivery tier (SubTickClick): the client input loop allows at
    # most one attack per tick, so repeated attacks closer than this are
    # bursts from packet-flooding modules or duplicated attack exploits.
    subtick-click-max-interval-ms: 25
    subtick-click-min-events: 3
    subtick-click-counter-seconds: 10
    # Slow-cadence metronome detection (SlowCadence check): sample count,
    # coefficient-of-variation ceiling and maximum interval in milliseconds.
    metronome-samples: 48
    metronome-cv: 0.05
    metronome-max-interval: 400
    # Steady-band cadence detection (SlowCadence "steady" tier): long sample
    # count and looser variation ceiling for randomized-delay triggerbots.
    steady-samples: 100
    steady-cv: 0.08
    # Rotating-attack detection (AttackRotation check): lookback window in
    # seconds, minimum attacks in window, required rotating fraction and the
    # per-tick rotation delta in degrees that counts as rotating.
    rotating-window-seconds: 60
    rotating-min-attacks: 12
    rotating-fraction: 0.8
    rotating-min-delta: 20.0
    # Attack-anchored return detection (ReturnFlick check): minimum rotation
    # burst in degrees before an attack, minimum return magnitude ratio,
    # endpoint tolerance relative to the burst, attacks required in the
    # lookback window and the required returned fraction.
    return-approach-min: 6.0
    return-ratio-min: 0.6
    return-endpoint-tolerance: 0.35
    return-window-attacks: 12
    return-window-seconds: 20
    return-fraction: 0.6
    # No-swing aura detection (NoSwingAttack check): how stale the last arm
    # animation may be for an attack to count as swung, and how many
    # unswung attacks in a row trigger a flag.
    swing-max-age-ms: 200
    swing-miss-attacks: 4
    # Mace smash-timing detection (MaceSmash check): minimal smash fall
    # window, how many recent smash attacks to judge, and the fraction that
    # must sit inside the window to flag.
    mace-band-min: 1.5
    mace-band-max: 1.7
    mace-min-attacks: 10
    mace-band-fraction: 0.9
    # Meta-swap detection (SwapAttack check): held slot changed within this
    # many ms of an attack, or reverted this fast; counts per window.
    swap-attack-gap-ms: 15
    swap-attack-min-pairs: 4
    swap-attack-revert-ms: 250
    swap-attack-counter-seconds: 60
    # Pearl-flash macro detection (PearlSwap check): a pearl thrown within
    # this many ms of a slot change counts as a pair; instant slot reverts
    # and the counter window mirror the swap-attack tuning.
    pearl-use-gap-ms: 15
    pearl-min-pairs: 4
    pearl-revert-ms: 250
    pearl-counter-seconds: 60
    # Triggerbot detection (TriggerBot check): attack latency after the target
    # first enters the crosshair of a near-static rotation.
    trigger-reaction-max-ms: 100
    trigger-static-speed: 1.5
    trigger-min-events: 3
    trigger-counter-seconds: 30
    # Precision tier (TriggerBot): delay-configured triggerbots firing a
    # little slower than the primary window are separated from fast humans
    # by how close the crosshair is to the hitbox center at the attack.
    trigger-precise-reaction-max-ms: 120.0
    trigger-precise-center-offset: 0.10
    trigger-precise-min-events: 4
    trigger-precise-counter-seconds: 60.0
    trigger-reach: 3.5
    # Instant crystal aura detection (CrystalCadence check): crystals broken
    # within this many ms of spawn, cycles needed and cadence CV ceiling.
    crystal-cycle-max-ms: 150
    crystal-min-cycles: 8
    crystal-cadence-max-cv: 0.6
    # Tick-quantized tier of CrystalCadence: cycles at or below this many
    # ticks enter the tick ring; breaks at or below this tick count are
    # "instant"; flag when that fraction over the ring is reached.
    crystal-tick-ring-max: 4
    crystal-instant-ticks: 3
    crystal-instant-fraction: 0.75
    # Ping ceiling (ms) above which ms-based timing checks ignore attacks, to
    # absorb out-of-order packet batching on high latency connections.
    timing-max-ping-ms: 150
    # Optional policy: cancel attack packets from players above this ping so
    # their hits do not register on the server. -1 disables.
    cancel-attack-over-ping-ms: -1
    # Anchor macro detection (AnchorCadence check): two clicks on the same
    # respawn anchor within this many ms count as one charge-detonate cycle;
    # cycles needed and cadence CV ceiling.
    anchor-cycle-max-ms: 150
    anchor-min-cycles: 8
    anchor-cadence-max-cv: 0.6

placement-analysis:
    # Airplace detection (AirPlace check): a clicked position must have been
    # stable air for this many ticks with no block history and no recent own
    # placement to count as a nonexistent block. Events needed within the
    # counter window to flag.
    airplace-stability-ticks: 20
    airplace-grace-ms: 400
    airplace-min-events: 2
    airplace-counter-seconds: 30
aim-analysis:
    # Machine-constant rotation detection (LinearRotation check): coefficient
    # of variation ceiling across 15 consecutive combat-speed rotation ticks.
    linear-cv-threshold: 0.05
    linear-min-speed: 3.0
    yaw-cv-threshold: 0.05
    yaw-min-speed: 2.0
    pitch-cv-threshold: 0.06
    pitch-min-speed: 0.8
    # Rotation decay detection (RotationDecay check): ratio band and maximum
    # spread of consecutive delta ratios, minimum starting speed in deg/tick.
    # Silent aim (SilentAim check): rotation snap toward the target around an
    # attack, followed by a revert to the pre-attack rotation. Degrees and ms.
    silent-flip-min-angle: 25.0
    silent-revert-angle: 10.0
    silent-attack-lag-ms: 40
    silent-revert-window-ms: 90
    silent-flips-to-flag: 2
    silent-counter-window-seconds: 10.0
    # Hitbox-center lock detection (Accuracy check): attacks whose crosshair
    # ray passes within this many blocks of the hitbox center count as
    # precise; fraction needed over the attack ring to flag.
    accuracy-center-offset: 0.025
    accuracy-min-attacks: 12
    accuracy-precision-fraction: 0.75
    # Through-wall aim detection (HiddenAim check): precision-tracking a
    # moving, occluded player. Range in blocks, tolerance in degrees from
    # the target center, min rotation updates, min target movement.
    hidden-aim-range: 24.0
    hidden-aim-tolerance-deg: 3.0
    hidden-aim-min-ticks: 10
    hidden-aim-move-blocks: 0.75
    hidden-aim-cooldown-seconds: 5
    decay-ratio-min: 0.18
    decay-ratio-max: 0.995
    decay-ratio-spread: 0.06
    decay-min-start: 6.0

idle-automation:
    # Anti-AFK automation detection (IdleAutomation check): a player who only
    # performs sparse idle actions (jump/swing) for this many seconds without
    # any rotation, movement or interaction. Minimum event count, average
    # interval band in seconds and the stillness window in milliseconds.
    window-seconds: 180
    min-events: 8
    min-interval-seconds: 3.0
    max-interval-seconds: 15.0
    stillness-milliseconds: 2000

jump-analysis:
    # Metronome jump tapping detection (JumpCadence check): pulses at or
    # below this many ticks count as taps; pulses needed, interval CV
    # ceiling and the longest interval that still counts as a rhythm.
    jump-max-pulse-ticks: 2
    jump-min-pulses: 12
    jump-interval-cv: 0.12
    jump-max-interval-ticks: 40

inventory-automation:
    # Container click-rate detection (FastClick check): window in seconds,
    # minimum pickup/shift-move clicks in the window and the mean interval in
    # milliseconds below which the cadence is superhuman.
    click-window-seconds: 10
    click-min-count: 60
    click-mean-interval-ms: 110.0
    # Menu-bot cadence detection (FastClick second tier): click interval CV
    # ceiling and the mean interval band for GUI navigation bots.
    menu-cadence-cv: 0.045
    menu-min-interval-ms: 250
    menu-max-interval-ms: 900
    # Hotbar tool automation detection (AutoToolChain check): lookback window
    # in seconds, minimum swap cycles and the mean turnaround ceiling in ms.
    tool-swap-window-seconds: 60
    tool-swap-min-cycles: 6
    tool-swap-mean-turnaround-ms: 400.0
    # Drop-everything macro detection (DropBurst check): lookback window in
    # seconds and the minimum burst size that triggers a flag.
    drop-window-seconds: 1
    drop-min-count: 12
    # Fake close-window detection (CloseSpoof check): a close-window packet
    # this many ms before an attack counts as a spoofed pair; pairs needed in
    # the counter window to flag.
    close-attack-max-ms: 50
    close-attack-min-pairs: 3
    close-attack-counter-seconds: 60
    # Container-interaction detection (InvWalk check): world interactions
    # count only this many ms after an open-window packet, need this many
    # events within the counter window to flag.
    invwalk-min-open-ms: 350
    invwalk-min-events: 2
    invwalk-counter-seconds: 10

reaction-analysis:
    # Damage reaction detection (DamageReaction check): maximum single
    # reaction in ms, mean reaction ceiling, minimum sample pairs and the
    # lookback window in seconds.
    damage-reaction-max-ms: 300.0
    damage-reaction-mean-ms: 120.0
    damage-reaction-min-pairs: 6
    damage-reaction-window-seconds: 300

fishing-analysis:
    # Auto-fish detection (AutoFish check): the reel must land inside this
    # many milliseconds of the bobber splash, this many times.
    reaction-max-ms: 120
    reaction-min-pairs: 3

elytra-analysis:
    # Firework cadence detection (FireworkCadence check): how many boost
    # intervals to judge, the interval CV ceiling, and the mean interval band.
    firework-min-intervals: 8
    firework-cadence-cv: 0.05
    firework-mean-min-ms: 700
    firework-mean-max-ms: 4000

pack-spoof:
    # Resource-pack spoof detection (PackSpoof check): acceptance-to-success
    # gap window in ms that machine spoofers land in, and how many fixed-gap
    # reports trigger a flag.
    spoof-min-ms: 293
    spoof-max-ms: 360
    spoof-min-pairs: 2

shadow-checks:
    # Checks listed here only send staff alerts and database logs. Webhook and
    # proxy broadcasts, console commands, kicks and bans are suppressed, so new
    # heuristic checks can be staged before enforcing. Substring matching, e.g.
    # "linearrotation" or "autoclicker". A single empty entry disables it.
    - ""

spectators:
    # Ukryj wszystkich widzów z uprawnieniem aethel.spectate, niezależnie od tego, czy są oni faktycznie aktywnymi widzami
    hide-regardless: false
    # Spowoduje, że widzowie będą ukryci tylko w tych światach, a pozostawienie pustego pola umożliwi dostęp do wszystkich światów
    allowed-worlds:
        - ""

# Ile czasu powinni mieć gracze, zanim ich wyrzucimy za przekroczenie limitu czasu? Domyślnie = 60 sekund
max-transaction-time: 30

# Włącz tę opcję, aby uniemożliwić Aethelowi anulowanie komunikatów Pong otrzymanych od graczy.
# Może to poprawić kompatybilność z innymi programami antycheatowymi. Może to powodować problemy z limiterami pakietów.
# Nie włączaj tej opcji, jeśli nie masz pewności, co robisz.
disable-pong-cancelling: false

# Czy domyślna procedura obsługi resynchronizacji bloków powinna zostać wyłączona?
# Domyślnie Aethel odczytuje bloki ze świata serwera i wysyła je do klienta w celu naprawy desynchronizacji.
# Jeśli używasz wtyczek, które tworzą fałszywe bloki oparte na pakietach (które nie istnieją w świecie serwera),
# powinieneś ustawić tę opcję na true, aby uniemożliwić Aethelowi nadpisywanie ich blokami air/real.
# Wymusza to użycie procedury obsługi „NoOp” (No Operation), chyba że zostanie ona udostępniona za pośrednictwem API.
disable-default-resync-handler: false

# Czy zduplikowany pakiet ruchu powinien zostać anulowany?
# Mojang naprawił ten problem w wersji 1.21. To była ich próba naprawienia „desynchronizacji kontenera”. https://bugs.mojang.com/browse/MC-12363
# To ustawienie dotyczy tylko klientów 1.17-1.20.5 na serwerach 1.8.
cancel-duplicate-packet: true

# Czy ignorować rotację w zduplikowanych pakietach
ignore-duplicate-packet-rotation: false

Simulation:
    # O ile powinniśmy pomnożyć całkowitą przewagę, gdy gracz gra zgodnie z zasadami?
    # Tak wygląda domyślna konfiguracja (oś x = sekundy, oś y = 1/1000 bloku): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.9998
    # Jak duże odchylenie od ruchu gracza powinno skutkować naruszeniem?
    # Mierzone w blokach od możliwego ruchu.
    # Uwzględniamy Optifine, przełączając tablice trygonometryczne, ale zmniejszenie tej wartości do 0.001 zmniejszy
    # liczbę fałszywych alarmów spowodowanych przez FastMath, jeśli ta kompensacja nie zadziała...
    threshold: 0.0005
    # Jak duże naruszenie w jednym ticku spowoduje natychmiastowe cofnięcie gracza?
    # -1 aby wyłączyć
    immediate-setback-threshold: 0.02
    # Jak dużą całkowitą przewagę (we wszystkich tickach) trzeba osiągnąć, zanim zaczniemy cofać gracza?
    # -1 aby wyłączyć
    max-advantage: 0.5
    # Po 50 sekundach z domyślną konfiguracją, przewaga gracza spadnie z 4 bloków do 1 bloku.
    # Ma to na celu zapobieżenie gromadzeniu zbyt wielu naruszeń, których gracz nie mógłby później wyzerować.
    # Domyślny sufit przewagi (oś x = sekundy, oś y = 1/1000 bloku): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 2
    # Próg poziomu naruszeń wymagany do cofnięcia.
    # 1 dla starego zachowania.
    setback-violation-threshold: 1

# Sprawdza, czy gracz wszedł w blok podczas ruchu.
Phase:
    setbackvl: 1 # Wchodzenie w bloki może umożliwiać wspinanie się po ścianach, dodatkowo ta kontrola jest względnie stabilna.
    decay: 0.001

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 1

FarPlace:
    cancelvl: 1

PositionPlace:
    cancelvl: 1

RotationPlace:
    cancelvl: 1

# Oparta na predykcji kontrola NoSlow.
# Aethel uwzględnia tutaj problematyczny kod sieciowy... trudno o fałszywe alarmy nawet przy spamowaniu prawym przyciskiem i przyciskiem offhand.
# Znacznie stabilniejsza niż w innych antycheatach, ale prosimy zgłaszać wszelkie fałszywe alarmy... Naprawiłem tu mnóstwo problemów z kodem sieciowym.
NoSlow:
    # Jakie odchylenie jest uznawane za "oszukiwanie"?
    # Domyślnie jest niższe niż w innych kontrolach.
    # Konsekwentnie wykrywa odchylenia o 0.03-0.2 przy włączonym NoSlow.
    threshold: 0.0005
    # Szybkie cofnięcie przy pierwszym użyciu przedmiotu, aby usunąć przewagę dawaną przez NoSlow.
    setbackvl: 2
    # Spadek naruszeń, gdy gracz używa przedmiotu I jest przez niego spowalniany.
    decay: 0.02

Knockback:
    # O ile powinniśmy pomnożyć całkowitą przewagę, gdy gracz gra zgodnie z zasadami?
    setback-decay-multiplier: 0.9998
    # Jak duże odchylenie od prędkości nadanej graczowi (velocity) powinno skutkować naruszeniem?
    # Mierzone w blokach od możliwej prędkości.
    threshold: 0.001
    # Jak duże naruszenie w jednym ticku spowoduje natychmiastowe cofnięcie gracza?
    # -1 aby wyłączyć
    immediate-setback-threshold: 0.02
    # Jak dużą całkowitą przewagę (we wszystkich tickach) trzeba osiągnąć, zanim zaczniemy cofać gracza?
    # -1 aby wyłączyć
    max-advantage: 0.5
    # Ma to na celu zapobieżenie gromadzeniu zbyt wielu naruszeń, których gracz nie mógłby później wyzerować.
    max-ceiling: 2

Explosion:
    threshold: 0.001
    setbackvl: 1

TimerA:
    setbackvl: 5
    # Liczba milisekund, które gracz może zgromadzić do późniejszego wykorzystania, gdy się opóźni.
    # Może potencjalnie umożliwić obejścia fast use/fast heal/fast bow z wersji 1.8, jeśli ustawione zbyt wysoko. 120 ms wydaje się dobrym kompromisem.
    drift: 60

# Ta kontrola ogranicza nadużywanie balansu z checku TimerA, zapobiegając zbytniemu opóźnieniu ruchu gracza względem czasu rzeczywistego.
TimerLimit:
    # Ping, przy którym kontrola zacznie ograniczać balans timera, aby zapobiec nadużyciom.
    # Może powodować pewne cofnięcia u uczciwych graczy, ale tylko jeśli mają ping powyżej tego progu.
    # -1 aby wyłączyć
    ping-abuse-limit-threshold: 250

NegativeTimer:
    # Liczba milisekund straconych podczas ruchu, zanim zaczniemy wykrywać naruszenia.
    drift: 500

# Ta sama metoda wykrywania co w TimerA, ale dla pojazdów.
VehicleTimer:
    # Celuje w timer 1.005
    setbackvl: 2

PacketOrderI:
    # Włącz, jeśli gracze są oznaczani za używanie modów do animacji z 1.7.
    exempt-placing-while-digging: false

Reach:
    # O ile powinniśmy zwiększyć hitboxy? 0.0005 powinno wykrywać zasięg 3.0005+.
    #
    # Wymuszone zwiększenie o 0.03 występuje w wersjach 1.9-1.18.1 (z wyjątkiem 1.18.2) lub w niektórych kombinacjach klient/serwer
    # ze względu na zmiany i ograniczenia protokołu. Ta kontrola jest najskuteczniejsza dla klientów 1.7/1.8 na serwerach 1.8.
    threshold: 0.0001
    # Czy powinniśmy anulować trafienia, które wiemy, że są niemożliwe?
    # Trafienia w przedziale 3.00-3.03 mogą przejść, ale nadal będą wykrywane z powodu ograniczeń kolejności pakietów.
    block-impossible-hits: true
    # Spowoduje to wysłanie dodatkowego pakietu na końcu każdego ticka, aby zwiększyć prawdopodobieństwo wykrycia oszustw.
    # Ta metoda wstrzykuje się w listę połączeń serwera, aby wysłać końcowy pakiet tuż przed wysłaniem (flushem) danych przez serwer.
    # Włączenie tego zwiększy użycie pasma dla wszystkich graczy.
    # Nie wpłynie to negatywnie na ogólną wydajność serwera.
    # Włączenie tego pozwoli wykryć więcej oszukujących graczy.
    # Pozostawienie tego wyłączonym nadal będzie wykrywać oszustów i nie spowoduje fałszywych alarmów.
    # Jeśli nie jesteś serwerem skoncentrowanym na PvP w wersji 1.8, ten dodatkowy pakiet nie jest zalecany.
    enable-post-packet: true

exploit:
    # Można uzyskać duże prędkości podczas sprintu i skoku z elytrą. To ustawienie zapobiega temu exploitowi, gdy jest ustawione na false.
    # Mojang zepsuł kod sieciowy, powodując, że start lotu elytrą jest obsługiwany przez klienta, a koniec przez serwer.
    # Elytry mają poziome tarcie 0.99, więc ciągłe dodawanie poziomej prędkości 0.2 skutkuje bardzo dużymi prędkościami.
    allow-sprint-jumping-when-using-elytra: false
    # Ta opcja łagodzi efekt stawiania bloków na tzw. ghostblockach poprzez resynchronizację gracza, gdy to nastąpi.
    allow-building-on-ghostblocks: false
    # To ustawienie, zależne od powyższej wartości logicznej, określa dystans do sprawdzania ghostblocków.
    # Jego prawidłowy zakres jest ograniczony od 2 do 4.
    distance-to-check-if-ghostblocks: 2

# Włącz logowanie pluginów, które wstrzyknęły się do netty podczas dołączania gracza, w celu debugowania problemów z kompatybilnością.
debug-pipeline-on-join: false

# Włącza eksperymentalne checki.
experimental-checks: true

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Aethel czasami anuluje nielegalne pakiety, np. przy użyciu timera. Po anulowaniu X pakietów na sekundę, kiedy powinniśmy
# po prostu wyrzucić gracza? Jest to wymagane, ponieważ niektóre limitery pakietów nie liczą pakietów anulowanych przez Aethela.
packet-spam-threshold: 30
# Włącz to, aby wydrukować stack trace, gdy gracz zostanie wyrzucony z powodu przekroczenia packet-spam-threshold.
debug-packet-cancel: false

# Aethel jest w stanie egzekwować, że gracz, który nie jest w stanie lotu, nie może mieć więcej niż X milisekund pingu.
# Wynika to z faktu, że Aethel obecnie nie sprawdza latających graczy.
# Aby wyłączyć, użyj -1.
max-ping-out-of-flying: 200

# Maksymalny ping, przy którym boost z fajerwerka jest usuwany graczowi.
# Zapobiega to sytuacji, w której gracze z wysokim opóźnieniem mogą używać jednego boostu z fajerwerka z elytrą w nieskończoność.
max-ping-firework-boost: 350

# Znaczniki schematu — zmieniaj tylko jeśli wiesz, co robisz.
#   config-flavor:  V2 = build Aethel 2.x, V3 = Aethel 3.x. Wtyczka odmawia
#                   wczytania konfiguracji, której flavor nie zgadza się z jej
#                   buildem; config V3 otwarty przez jar V2 natychmiast się
#                   nie powiedzie, zamiast po cichu scalać się w niewłaściwe
#                   klucze.
#   config-version: zwiększany przy każdej niekompatybilnej zmianie formatu.
#                   Stare configi są automatycznie migrowane przez wbudowany
#                   updater przy następnym starcie.
# Aethel zawsze odświeża uprawnienia w pamięci podręcznej, gdy gracz dołącza i gdy
# Aethel jest przeładowywany, niezależnie od tego, czy LuckPerms jest zainstalowany.
# Hooki zdarzeń LuckPerms w typowych konfiguracjach również natychmiast odświeżają
# uprawnienia Aethel w pamięci podręcznej.
# Ten okresowy fallback jest potrzebny tylko dla zmian uprawnień online, których
# nie obejmują te zdarzenia, np. niestandardowego kontekstu LuckPerms, który nie
# wywołuje signalContextUpdate, luk w kontekstach Fabric albo dostawcy uprawnień
# innego niż LuckPerms, który zmienia uprawnienia na żywo.
# Ustaw -1, aby wyłączyć odpytywanie. Ustaw wartość dodatnią, aby odświeżać co X ticków.
update-permission-ticks: 20

config-flavor: V2
config-version: 50

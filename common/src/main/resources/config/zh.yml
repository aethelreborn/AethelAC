# 中文翻译提供 Regotly / nuym / Dg32z_ / tjshtqwq , 如有错误请提交 Issues 并@我们

alerts:
    # 除了向有权限的玩家发送作弊vl外，是否还在控制台中打印作弊vl消息？
    print-to-console: true
    # 是否在其他子服中发送控制台的作弊信息
    # 如果正在使用Velocity，你必须在Velocity的配置中启用` bungee-plugin-message-channel `。
    proxy:
        # 作弊消息是否应该发送到连接到代理的子服?
        send: true
        # 此服务器是否接收来自其他子服的作弊消息？
        receive: true

verbose:
    # 是否在控制台中打印verbose信息
    print-to-console: true
# 是否检查更新
check-for-updates: false

client-brand:
    # 这意味着如果客户端型号匹配以下正则表达式，它将不会将其客户端版本显示在聊天栏中
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Aethel 将把包含内置攻击距离修改功能的特定 Forge 版本列入黑名单（Forge 1.18.2 至 1.19.3） 可能会导致1.18.2-1.19.3的Forge版本玩家无法进入服务器。
    # 将此选项设置为 false 将允许上述客户端连接服务器。禁用此选项需自行承担风险（建议打开）。
    disconnect-blacklisted-forge-versions: true

client-fingerprint:
    # Substrings matched case-insensitively against the client brand packet.
    # A match flags the Fingerprint check. Keep this list to known cheat clients.
    brands:
        - "wurst"
        - "meteor"
        - "sigma"
        - "impact"
        - "future"
        - "salhack"
        - "konas"
        - "novoline"
        - "astolfo"
        - "aristois"
        - "bleachhack"
        - "lambda"
        - "aethelclient"
        - "tru3club"
    # Substrings matched case-insensitively against channels registered by the
    # client (minecraft:register payload). A match flags the Fingerprint check.
    channels:
        - "wurst:"
        - "meteor-client:"
        - "bleachhack:"
        - "aethelclient"
        - "tru3club"
        - "impact"
        - "future:"
        - "konas"
        - "novoline"
        - "sigma"
        - "salhack"
        - "lambda"

attack-patterns:
    # Autoclicker detection (sustained attacks per second within the window).
    # 18 CPS across a full minute or 20 CPS across 20 seconds is beyond
    # sustained human clicking; raise these on drag-click-heavy 1.8 servers.
    cps60-threshold: 18.0
    cps20-threshold: 20.0
    # Coefficient of variation below which 100+ consecutive attack intervals
    # at an elevated click rate count as machine cadence.
    cadence-cv-threshold: 0.06
    # Sustained clicking above this rate that never produces a sub-burst-gap
    # interval counts as machine cadence (humans burst at high CPS).
    no-burst-min-cps: 14.0
    burst-gap-ms: 35.0
    # Uniformly randomized click detection (UniformClick check): click
    # intervals needed, minimum CPS, the longest interval that keeps the
    # stream alive and the excess-kurtosis ceiling below which a bounded
    # random distribution counts as machine.
    uniform-click-samples: 200
    uniform-click-min-cps: 5.0
    uniform-click-max-interval-ms: 1000.0
    uniform-click-max-kurtosis: 0.5
    # Sub-tick delivery tier (SubTickClick): the client input loop allows at
    # most one attack per tick, so repeated attacks closer than this are
    # bursts from packet-flooding modules or duplicated attack exploits.
    subtick-click-max-interval-ms: 25
    subtick-click-min-events: 3
    subtick-click-counter-seconds: 10
    # Sub-tick dig tier (SubTickBreak): the client input loop allows at most
    # one dig start per tick, so repeated starts closer than this are floods
    # from nuker modules or duplicated dig exploits.
    subtick-break-max-interval-ms: 25
    subtick-break-min-events: 3
    subtick-break-counter-seconds: 10
    # Post-break dig tier (NoBreakDelay): the client waits five ticks after a
    # completed break before it starts the next dig, so a dig start closer than
    # this to the previous break means the delay was removed.  Events are
    # skipped when the client's own tick packets (movement packets or the arm
    # swing sent once per tick while mining) prove it ticked through the window,
    # since a stalled connection delivers both packets at once and would
    # otherwise look like a removed delay.
    post-break-delay-ms: 150
    post-break-tick-signals: 4
    post-break-min-events: 3
    post-break-counter-seconds: 10
    # Shield toggle tier (AutoBlock): shield use within this many ms of an
    # attack, repeated, is a module signature; humans cannot re-press the
    # shield key on every single click that fast.
    autoblock-max-gap-ms: 50.0
    autoblock-min-events: 4
    autoblock-counter-seconds: 60.0
    # Slow-cadence metronome detection (SlowCadence check): sample count,
    # coefficient-of-variation ceiling and maximum interval in milliseconds.
    metronome-samples: 48
    metronome-cv: 0.05
    metronome-max-interval: 400
    # Steady-band cadence detection (SlowCadence "steady" tier): long sample
    # count and looser variation ceiling for randomized-delay triggerbots.
    steady-samples: 100
    steady-cv: 0.08
    # Rotating-attack detection (AttackRotation check): lookback window in
    # seconds, minimum attacks in window, required rotating fraction and the
    # per-tick rotation delta in degrees that counts as rotating.
    rotating-window-seconds: 60
    rotating-min-attacks: 12
    rotating-fraction: 0.8
    rotating-min-delta: 20.0
    # Attack-anchored return detection (ReturnFlick check): minimum rotation
    # burst in degrees before an attack, minimum return magnitude ratio,
    # endpoint tolerance relative to the burst, attacks required in the
    # lookback window and the required returned fraction.
    return-approach-min: 6.0
    return-ratio-min: 0.6
    return-endpoint-tolerance: 0.35
    return-window-attacks: 12
    return-window-seconds: 20
    return-fraction: 0.6
    # No-swing aura detection (NoSwingAttack check): how stale the last arm
    # animation may be for an attack to count as swung, and how many
    # unswung attacks in a row trigger a flag.
    swing-max-age-ms: 200
    swing-miss-attacks: 4
    # Mace smash-timing detection (MaceSmash check): minimal smash fall
    # window, how many recent smash attacks to judge, and the fraction that
    # must sit inside the window to flag.
    mace-band-min: 1.5
    mace-band-max: 1.7
    mace-min-attacks: 10
    mace-band-fraction: 0.9
    # Meta-swap detection (SwapAttack check): held slot changed within this
    # many ms of an attack, or reverted this fast; counts per window.
    swap-attack-gap-ms: 15
    swap-attack-min-pairs: 4
    swap-attack-revert-ms: 250
    swap-attack-counter-seconds: 60
    # Pearl-flash macro detection (PearlSwap check): a pearl thrown within
    # this many ms of a slot change counts as a pair; instant slot reverts
    # and the counter window mirror the swap-attack tuning.
    pearl-use-gap-ms: 15
    pearl-min-pairs: 4
    pearl-revert-ms: 250
    pearl-counter-seconds: 60
    # Triggerbot detection (TriggerBot check): attack latency after the target
    # first enters the crosshair of a near-static rotation.
    trigger-reaction-max-ms: 100
    trigger-static-speed: 1.5
    trigger-min-events: 3
    trigger-counter-seconds: 30
    # Precision tier (TriggerBot): delay-configured triggerbots firing a
    # little slower than the primary window are separated from fast humans
    # by how close the crosshair is to the hitbox center at the attack.
    trigger-precise-reaction-max-ms: 120.0
    trigger-precise-center-offset: 0.10
    trigger-precise-min-events: 4
    trigger-precise-counter-seconds: 60.0
    # Metronome tier (TriggerBot): delayed triggerbots that answer nearly
    # every crosshair opportunity with a machine-steady reaction. An
    # opportunity is an uninterrupted crosshair entry lasting at least the
    # duration below; the tier flags when, over the configured window of
    # opportunities, the fire ratio, mean reaction and coefficient of
    # variation all fall inside bot territory.
    trigger-metronome-opportunity-ms: 300.0
    trigger-metronome-window: 20
    trigger-metronome-min-ratio: 0.85
    trigger-metronome-min-mean-ms: 100.0
    trigger-metronome-max-mean-ms: 280.0
    trigger-metronome-max-cv: 0.10
    # Late-band metronome tier: narrowly jittered modules sleeping up to the
    # late mean ceiling are flagged at a much tighter reaction CV ceiling,
    # because tick quantization leaves a human's spread too wide to pass.
    trigger-metronome-late-max-mean-ms: 460.0
    trigger-metronome-late-max-cv: 0.04
    trigger-reach: 3.5
    # Instant crystal aura detection (CrystalCadence check): crystals broken
    # within this many ms of spawn, cycles needed and cadence CV ceiling.
    crystal-cycle-max-ms: 150
    crystal-min-cycles: 8
    crystal-cadence-max-cv: 0.6
    # Tick-quantized tier of CrystalCadence: cycles at or below this many
    # ticks enter the tick ring; breaks at or below this tick count are
    # "instant"; flag when that fraction over the ring is reached.
    crystal-tick-ring-max: 4
    crystal-instant-ticks: 3
    crystal-instant-fraction: 0.75
    # Ping ceiling (ms) above which ms-based timing checks ignore attacks, to
    # absorb out-of-order packet batching on high latency connections.
    timing-max-ping-ms: 150
    # Optional policy: cancel attack packets from players above this ping so
    # their hits do not register on the server. -1 disables.
    cancel-attack-over-ping-ms: -1
    # Anchor macro detection (AnchorCadence check): two clicks on the same
    # respawn anchor within this many ms count as one charge-detonate cycle;
    # cycles needed and cadence CV ceiling.
    anchor-cycle-max-ms: 150
    anchor-min-cycles: 8
    anchor-cadence-max-cv: 0.6

placement-analysis:
    # Airplace detection (AirPlace check): a clicked position must have been
    # stable air for this many ticks with no block history and no recent own
    # placement to count as a nonexistent block. Events needed within the
    # counter window to flag.
    airplace-stability-ticks: 20
    airplace-grace-ms: 400
    airplace-min-events: 2
    airplace-counter-seconds: 30
aim-analysis:
    # Machine-constant rotation detection (LinearRotation check): coefficient
    # of variation ceiling across 15 consecutive combat-speed rotation ticks.
    linear-cv-threshold: 0.05
    linear-min-speed: 3.0
    yaw-cv-threshold: 0.05
    yaw-min-speed: 2.0
    pitch-cv-threshold: 0.06
    pitch-min-speed: 0.8
    # Rotation decay detection (RotationDecay check): ratio band and maximum
    # spread of consecutive delta ratios, minimum starting speed in deg/tick.
    # Silent aim (SilentAim check): rotation snap toward the target around an
    # attack, followed by a revert to the pre-attack rotation. Degrees and ms.
    silent-flip-min-angle: 25.0
    silent-revert-angle: 10.0
    silent-attack-lag-ms: 40
    silent-revert-window-ms: 90
    silent-flips-to-flag: 2
    silent-counter-window-seconds: 10.0
    # Hitbox-center lock detection (Accuracy check): attacks whose crosshair
    # ray passes within this many blocks of the hitbox center count as
    # precise; fraction needed over the attack ring to flag.
    accuracy-center-offset: 0.025
    accuracy-min-attacks: 12
    accuracy-precision-fraction: 0.75
    # Through-wall aim detection (HiddenAim check): precision-tracking a
    # moving, occluded player. Range in blocks, tolerance in degrees from
    # the target center, min rotation updates, min target movement.
    hidden-aim-range: 24.0
    hidden-aim-tolerance-deg: 3.0
    hidden-aim-min-ticks: 10
    hidden-aim-move-blocks: 0.75
    hidden-aim-cooldown-seconds: 5
    decay-ratio-min: 0.18
    decay-ratio-max: 0.995
    decay-ratio-spread: 0.06
    decay-min-start: 6.0
    # Rotation grid detection (RotationGrid check): a legitimate mouse stream
    # consists of whole multiples of one sensitivity quantum. The check fits
    # the smallest well-populated delta cluster inside this quantum band and
    # then counts combat rotation deltas that are neither multiples of it nor
    # explained by any other populated cluster. Tolerance is absolute degrees;
    # violations are counted over the probe ring; combat window is ms since
    # the last attack; cooldown is seconds between flags.
    grid-min-quantum: 0.015
    grid-max-quantum: 0.72
    grid-cluster-evidence: 8
    grid-tolerance-deg: 0.004
    grid-min-violations: 8
    grid-window-samples: 30
    grid-combat-window-ms: 3000
    grid-flag-cooldown-seconds: 5
    # Sustained tier: the fitted quantum survives this many seconds without
    # fresh grid evidence, so a fight full of synthetic rotation cannot close
    # the gate mid-combat; the horizon tier flags when the violation fraction
    # of the last grid-horizon-samples armed probes reaches grid-horizon-percent
    # (catches slow-burn corrections that never cluster into a 30-probe burst).
    grid-memory-seconds: 120
    grid-horizon-samples: 300
    grid-horizon-percent: 5.0
    # Tracking-lock detection (TrackingLock check): a target direction that
    # sweeps at least tracking-lock-omega-min-deg per tick is a swept tick;
    # a swept tick is locked when the crosshair sits within
    # tracking-lock-lock-deg of the hitbox center. Flags when the trailing
    # tracking-lock-window-ticks window holds at least
    # tracking-lock-min-samples swept ticks and tracking-lock-min-reversals
    # direction flips (at or above tracking-lock-reversal-floor-deg) with a
    # locked fraction of tracking-lock-fraction. Range in blocks, capture in
    # degrees around the crosshair, cooldown in seconds.
    tracking-lock-range: 24.0
    tracking-lock-window-ticks: 60
    tracking-lock-capture-deg: 25.0
    tracking-lock-lock-deg: 1.5
    tracking-lock-omega-min-deg: 1.5
    tracking-lock-reversal-floor-deg: 0.1
    tracking-lock-min-samples: 20
    tracking-lock-min-reversals: 3
    tracking-lock-fraction: 0.9
    tracking-lock-cooldown-seconds: 5

idle-automation:
    # Anti-AFK automation detection (IdleAutomation check): a player who only
    # performs sparse idle actions (jump/swing) for this many seconds without
    # any rotation, movement or interaction. Minimum event count, average
    # interval band in seconds and the stillness window in milliseconds.
    window-seconds: 180
    min-events: 8
    min-interval-seconds: 3.0
    max-interval-seconds: 15.0
    stillness-milliseconds: 2000

jump-analysis:
    # Metronome jump tapping detection (JumpCadence check): pulses at or
    # below this many ticks count as taps; pulses needed, interval CV
    # ceiling and the longest interval that still counts as a rhythm.
    jump-max-pulse-ticks: 2
    jump-min-pulses: 12
    jump-interval-cv: 0.12
    jump-max-interval-ticks: 40
    # Automatic jump-reset detection (JumpReset check): a jump this many
    # ticks after a knockback (plus one tick per 50 ms of ping), repeated,
    # is a module pinning the reset to the velocity packet.
    jumpreset-max-ticks: 2
    jumpreset-min-events: 5
    jumpreset-counter-seconds: 60.0

inventory-automation:
    # Container click-rate detection (FastClick check): window in seconds,
    # minimum pickup/shift-move clicks in the window and the mean interval in
    # milliseconds below which the cadence is superhuman.
    click-window-seconds: 10
    click-min-count: 60
    click-mean-interval-ms: 110.0
    # Menu-bot cadence detection (FastClick second tier): click interval CV
    # ceiling and the mean interval band for GUI navigation bots. The
    # variance, not the pace, is the machine criterion - human item selection
    # injects tens of milliseconds of jitter even at fast loot rates.
    menu-cadence-cv: 0.045
    menu-min-interval-ms: 110
    menu-max-interval-ms: 900
    # Zero-reaction looting detection (FastClick third tier): the first click
    # on a freshly opened window this many ms or less after the round-trip
    # floor is a module reacting to the packet instead of the screen; this
    # many such clicks inside the counter window flag. Windows whose
    # round-trip floor exceeds the ping ceiling are never judged, and bedrock
    # (Geyser/Floodgate) players are exempt.
    click-reaction-min-ms: 70.0
    click-reaction-min-events: 3
    click-reaction-counter-seconds: 10
    click-reaction-max-ping-ms: 300
    # Hotbar tool automation detection (AutoToolChain check): lookback window
    # in seconds, minimum swap cycles and the mean turnaround ceiling in ms.
    tool-swap-window-seconds: 60
    tool-swap-min-cycles: 6
    tool-swap-mean-turnaround-ms: 400.0
    # Drop-everything macro detection (DropBurst check): lookback window in
    # seconds and the minimum burst size that triggers a flag.
    drop-window-seconds: 1
    drop-min-count: 12
    # Fake close-window detection (CloseSpoof check): a close-window packet
    # this many ms before an attack counts as a spoofed pair; pairs needed in
    # the counter window to flag.
    close-attack-max-ms: 50
    close-attack-min-pairs: 3
    close-attack-counter-seconds: 60
    # Container-interaction detection (InvWalk check): world interactions
    # count only this many ms after an open-window packet, need this many
    # events within the counter window to flag.
    invwalk-min-open-ms: 350
    invwalk-min-events: 2
    invwalk-counter-seconds: 10
    # GUI-rotation detection (InvWalk rotation tier): a rotation update
    # counts when the summed yaw+pitch delta reaches this many degrees;
    # this many counted updates within the counter window flags. Bedrock
    # (Geyser/Floodgate) players are exempt.
    invwalk-rotation-min-delta-deg: 0.5
    invwalk-rotation-min-events: 2
    invwalk-rotation-counter-seconds: 10

reaction-analysis:
    # Damage reaction detection (DamageReaction check): maximum single
    # reaction in ms, mean reaction ceiling, minimum sample pairs and the
    # lookback window in seconds.
    damage-reaction-max-ms: 300.0
    damage-reaction-mean-ms: 120.0
    damage-reaction-min-pairs: 6
    damage-reaction-window-seconds: 300

fishing-analysis:
    # Auto-fish detection (AutoFish check): the reel must land inside this
    # many milliseconds of the bobber splash, this many times.
    reaction-max-ms: 120
    reaction-min-pairs: 3

elytra-analysis:
    # Firework cadence detection (FireworkCadence check): how many boost
    # intervals to judge, the interval CV ceiling, and the mean interval band.
    firework-min-intervals: 8
    firework-cadence-cv: 0.05
    firework-mean-min-ms: 700
    firework-mean-max-ms: 4000

pack-spoof:
    # Resource-pack spoof detection (PackSpoof check): acceptance-to-success
    # gap window in ms that machine spoofers land in, and how many fixed-gap
    # reports trigger a flag.
    spoof-min-ms: 293
    spoof-max-ms: 360
    spoof-min-pairs: 2

ping-spoof:
    # Keepalive-vs-transaction ping divergence detection (PingSpoof check):
    # a spoofing client delays only the keepalive replies it knows the server
    # times, so our own keepalive round trips run ahead of the transaction
    # round trips measured by Grim. Keepalives every second (Paper-style
    # fleets, proxies) give the check the most samples; a vanilla 15 second
    # interval still works, just with later judgement. min-divergence-ms is
    # the median paired gap that counts as spoofing, max-spread-ms the
    # keepalive stream spread above which frame quantization or a jittery
    # link makes the two indistinguishable (never judged), and
    # min-keepalive-spread-ms skips perfectly steady streams (frame-locked
    # timing). Judgement needs min-keepalive-samples paired samples and
    # min-transaction-samples transaction samples inside window-seconds, then
    # min-events events inside counter-seconds (events are counted at most
    # once per second).
    min-divergence-ms: 100.0
    max-spread-ms: 80.0
    min-keepalive-spread-ms: 2.0
    min-keepalive-samples: 4
    min-transaction-samples: 16
    pair-window-seconds: 3.0
    window-seconds: 60
    min-events: 3
    counter-seconds: 15
shadow-checks:
    # Checks listed here only send staff alerts and database logs. Webhook and
    # proxy broadcasts, console commands, kicks and bans are suppressed, so new
    # heuristic checks can be staged before enforcing. Substring matching, e.g.
    # "linearrotation" or "autoclicker". A single empty entry disables it.
    - ""

spectators:
    # 将拥有 aethel.spectate 权限的人进行隐藏,不管他是否在观察玩家
    hide-regardless: false
    # 观察者在这些世界不会隐藏
    allowed-worlds:
        - ""

# 在玩家无法接收 AethelAC 的 transaction 数据包后,多少秒对玩家进行踢出
# 默认踢出原因为: disconnect.timeout
# 玩家超时踢出时间（单位：秒）（默认 = 60）
max-transaction-time: 30

# 启用此选项可禁止Aethel取消接收到的Pong包。
# 可能会优化和其他反作弊的兼容性，但可能会与数据包限制器冲突
# 在你不知道你在干什么的情况下，不要启用。
disable-pong-cancelling: false

# 是否应禁用默认的方块重新同步处理程序？
# 默认情况下，Aethel 会从服务器世界读取方块并将它们发送给客户端以修复不同步问题。
# 如果您使用通过数据包创建虚假方块（在服务器世界中不存在）的插件，
# 您应将其设置为 true，以防止 Aethel用空气/真实方块覆盖它们。
# 除非通过 API 提供了自定义处理程序，否则这将强制使用 "NoOp"（无操作）处理程序。
disable-default-resync-handler: false

# 是否对重复的移动数据包进行撤销?
# 这可以修复 "bucket desync"（桶不同步问题）. https://bugs.mojang.com/browse/MC-12363,不过Mojang已经在1.21修复了这个问题
# 这仅仅适用于1.8服务器中使用1.17-1.20.5版本的玩家
cancel-duplicate-packet: true

# 是否忽视重复的数据包中的玩家转头
ignore-duplicate-packet-rotation: false

Simulation:
    # 这个检查通过仿真玩家的移动，并与玩家的实际移动进行比较
    # 仿真出的位置（玩家理应到达的位置）和玩家实际位置的偏差（距离）即为移动优势。

    # 当玩家合法时，我们应该将总移动优势乘以多少
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.9998
    # 最大允许玩家移动优势的阈值（单位：方块）
    # 已经内置了Optifine FastMath的三角函数表，设置为0.001可避免FastMath误判
    # 若玩家移动优势大于此阈值，标记玩家作弊
    threshold: 0.0005
    # 若玩家的移动优势超过此值，玩家会被强制回弹
    # 假设作弊者的移动优势为0.12，且设置的是0.1，0.12 >= 0.1，玩家会立即被回弹到本应到达的位置
    # -1 关闭此项
    immediate-setback-threshold: 0.02
    # 若玩家的总移动优势超过此值，玩家会被强制回弹
    # 假设作弊者1个游戏刻的移动优势为0.11，并且违规了10次（10个游戏刻），即0.11*10，为1.1
    # 若设置的值为1，1.1 >= 1，那么玩家会立即被回弹到本应到达的位置
    # -1 关闭此项
    max-advantage: 0.5
    # 在默认配置的50秒后，玩家的总优势将从4个方块变为1个方块
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/4lovswdarj

    # 若玩家的总移动优势大于此项，则会被重置为此项
    # 例如：总移动优势为4.2，会被强制重置到4
    # 这是为了防止玩家的总移动优势过大，并且永远无法清除总移动优势
    max-ceiling: 2
    # 设置回弹的违规等级阈值
    # 1 为旧行为
    setback-violation-threshold: 1

# 检查玩家是否穿墙
Phase:
    setbackvl: 1 # 错误的方块可以允许爬墙，加上这个检查是相对稳定的
    decay: 0.001

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 1

FarPlace:
    cancelvl: 1

PositionPlace:
    cancelvl: 1

RotationPlace:
    cancelvl: 1

# 使用模拟移动进行的NoSlow(使用物品时不会减速)检查
# 在这里解释错误的服务器代码......即使在发送垃圾数据包时右键单击和副手按钮也很分辨
# 比其他反作弊更稳定，但请报告任何错误......我在这里修复了大量的代码问题。
NoSlow:
    # 最大允许玩家在使用物品时的移动优势（单位：方块）
    # 启用 NoSlow 后，标记量持续为 0.03-0.2
    threshold: 0.0005
    # 到达多少VL时回弹
    setbackvl: 2
    # 当玩家使用一个物品并被它减慢时衰减多少VL
    decay: 0.02

Knockback:
    # 当玩家合法时，我们应该将总优势乘以多少
    setback-decay-multiplier: 0.9998
    # 最大允许玩家的移动优势（单位：方块）
    threshold: 0.001
    # 若玩家的总移动优势超过此值，玩家会被强制回弹
    # 假设作弊者1个游戏刻的移动优势为0.11，并且违规了10次（10个游戏刻），即0.11*10，为1.1
    # 若设置的值为1，1.1 >= 1，那么玩家会立即被回弹到本应到达的位置
    # -1 关闭此项
    immediate-setback-threshold: 0.02
    # 若玩家的总移动优势超过此值，玩家会被强制回弹
    # 假设作弊者1个游戏刻的移动优势为0.11，并且违规了10次（10个游戏刻），即0.11*10，为1.1
    # 若设置的值为1，1.1 >= 1，那么玩家会立即被回弹到本应到达的位置
    # -1 关闭此项
    max-advantage: 0.5
    # 若玩家的总移动优势大于此项，则会被重置为此项
    # 例如：总移动优势为4.2，会被强制重置到4
    # 这是为了防止玩家的总移动优势过大，并且永远无法清除总移动优势
    max-ceiling: 2


Explosion:
    threshold: 0.001
    # 若玩家的总移动优势超过此值，玩家会被强制回弹
    # 假设作弊者1个游戏刻的移动优势为0.11，并且违规了10次（10个游戏刻），即0.11*10，为1.1
    # 若设置的值为1，1.1 >= 1，那么玩家会立即被回弹到本应到达的位置
    # -1 关闭此项
    setbackvl: 1
    # 到达多少VL时回弹

TimerA:
    setbackvl: 5
    drift: 60
    # 玩家卡顿时，可以累积以供以后使用的时间（单位：毫秒）
    # 如果设置得太高，可能会允许 1.8版本的快速使用/快速回血/快速射弓绕过，120毫秒似乎是一个很好的平衡

# 此项是config是用来防止玩家移动与实时差距过大，来限制对 TimerA 平衡机制的滥用。
TimerLimit:
    # 在检查玩家的延迟时对timer balance进行限制, 防止滥用
    # 在合法玩家的延迟超过这个延迟阈值时可能会造成误拉回
    # 填写-1则关闭
    ping-abuse-limit-threshold: 250

NegativeTimer:
    # 玩家的移动丢失了多少毫秒？
    drift: 500

# 与 TimerA 相同的检查方法，但适用于坐骑
VehicleTimer:
    # 实体的1.0005Timer 检查
    setbackvl: 2
    # VL达到多少时回弹？

PacketOrderI:
    # 如果玩家因使用1.7动画模组而误判，则启用此项
    exempt-placing-while-digging: false

Reach:
    threshold: 0.0001
    # 我们应该将实体碰撞箱扩大多少？ 0.0005 应该检测到 3.0005+ reach
    #
    # 在 1.9-1.18.1（不是 1.18.2）或某些客户端/服务器组合中存在 0.03 距离的增加，因为
    # 协议更改和限制。 对于 1.8 服务器上的 1.7/1.8 客户端，此检查功能最为强大。
    block-impossible-hits: true
    # 我们应该取消不合法的攻击吗？
    # 攻击距离为3.00-3.03可能不会被取消，但仍会被作弊标记，因为有数据包顺序限制
    enable-post-packet: true
    # 这将在每个游戏刻（tick）结束时发送一个额外的数据包，以检查更多的作弊
    # 这会注入服务器的连接列表以在服务器刷新之前发送最终数据
    # 启用这将增加所有玩家的带宽占用
    # 但这不会降低整体服务器性能
    # 启用此功能将检查到更多作弊者。
    # 禁用此功能仍会检查到作弊者，不会导致误报
    # 除非你是专注于1.8版本的PvP服务器，否则不建议使用这个额外的数据包

exploit:
    allow-sprint-jumping-when-using-elytra: false
    # 是否允许玩家在使用鞘翅时候进行的疾跑跳跃
    allow-building-on-ghostblocks: false
    # 该选项可在发生假方块时重新同步玩家方块，并允许玩家在假方块上继续放置方块
    distance-to-check-if-ghostblocks: 2
    # 检查假方块的距离。
    # 范围限制为 2 到 4

# 启用在加入时注入 netty 的日志插件以调试兼容性问题
debug-pipeline-on-join: false

# 启用实验性检查
# Shipped default: true. With this false, every tier marked experimental is
# completely silent - no alerts, no punishments, no stored evidence - which
# drops most of the newest detection stack. A config carried over from before
# this default flipped keeps its old false; set it to true to restore them.
experimental-checks: true

# 取消有问题的格挡
reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Aethel有时会取消非法的数据包，比如Timer。
# 在一秒钟内取消了多少个数据包后，我们应该踢掉这个玩家？
# 我们认为你应该启用此项，因为有些数据包限制器并不记录被Aethel取消的数据包。
packet-spam-threshold: 30
# 启用此项可在玩家因 packet-spam-threshold 被踢时打印堆栈追踪
debug-packet-cancel: false

# 在玩家处于非飞行状态，且ping（延迟）大于多少毫秒后，Aethel会踢出这个玩家？
# 填写-1则关闭
max-ping-out-of-flying: 200

# 当玩家使用鞘翅飞行，且ping（延迟）大于多少毫秒后，Aethel会取消这个玩家正在使用的烟花火箭？
# 可以避免高延迟玩家使用一个烟花火箭就可以一直飞行
# 填写-1则关闭
max-ping-firework-boost: 350

# 模式标记 — 除非你清楚自己在做什么，否则不要修改。
#   config-flavor:  V2 = Aethel 2.x 构建，V3 = Aethel 3.x。如果配置的 flavor
#                   与插件构建不一致（例如用 V2 jar 打开 V3 配置），插件会
#                   拒绝加载并立即报错，而不是悄悄合并到错误的键。
#   config-version: 每次发生破坏性结构变更都会递增。下次启动时，旧配置会由
#                   内置 updater 自动迁移。
# 无论是否安装 LuckPerms，玩家加入服务器以及 Aethel 重载时，Aethel 都会刷新缓存的权限。
# 在常规配置中，LuckPerms 的事件钩子也会立即刷新缓存的 Aethel 权限。
# 只有当在线权限变化没有被这些事件覆盖时，才需要这个定期兜底刷新，
# 例如自定义 LuckPerms context 没有调用 signalContextUpdate、Fabric context
# 存在缺口，或非 LuckPerms 权限提供器会在运行中改变权限。
# 设为 -1 可禁用轮询。设为正数则每 X tick 刷新一次。
update-permission-ticks: 20

config-flavor: V2
config-version: 62

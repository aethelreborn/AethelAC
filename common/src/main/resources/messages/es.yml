# \u00BB es » (doble >>), ANSI y UTF-8 interpreta esto diferente... puede que incluso veas "?" debido a esto.
prefix: "&bAethel &8\u00BB"

alerts-enabled: "%prefix% &fAlertas habilitadas"
alerts-disabled: "%prefix% &fAlertas deshabilitadas"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% se ha unido usando %brand%"
console-specify-target: "%prefix% &c¡Debes especificar a alguien siendo la consola!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &c¡El jugador esta excluido o fuera de linea!"
player-not-this-server: "%prefix% &c¡El jugador no esta en este servidor!"
sender-not-found: "%prefix% &c¡No puedes usar este comando si estás exento!"
spectate-return: "<click:run_command:/aethel stopspectating><hover:show_text:\"/aethel stopspectating\">\n%prefix% &fClick aquí para volver a la localización previa\n</hover></click>"
cannot-spectate-return: "%prefix% &cSolo puedes hacer esto despues de espectar a un jugador"
cannot-run-on-self: "%prefix% &cNo puedes usar este comando en ti mismo!"
upload-log: "%prefix% &fSubido el registro de depuración a: %url%"
upload-log-start: "%prefix% &fSubiendo registros... por favor espera"
upload-log-not-found: "%prefix% &cNo se pudo encontrar ese registro"
upload-log-upload-failure: "%prefix% &cAlgo salio mal mientras subíamos ese registro, mira la consola para mas información"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &c¡Este comando solo puede ser utilizado por jugadores!"
run-as-player-or-console: "%prefix% &c¡Este comando solo puede ser utilizado por jugadores o la consola!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Placeholders validos:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violaciones
# %verbose% - información extra de la comprobación como compensaciones. No todas añadirán informacion.
alerts-format: "%prefix% &f%player% &bfalló <hover:show_text:\"&b%check_name%%experimental%\n&8Descripción: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfailed <hover:show_text:\"&b%check_name%%experimental%\n&8Descripción: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bPerfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersión: &f%version%"
    - "&bMarca del cliente: &f%brand%"
    - "&bSensibilidad horizontal: &f%h_sensitivity%%"
    - "&bSensibilidad vertical: &f%v_sensitivity%%"
    - "&bFastMath habilitado: &f%fast_math%"
    - "&bAtaques/s (60s): &f%attack_cps%"
    - "&bCV de cadencia: &f%attack_cadence_cv%"
    - "&bAtaques en rotación: &f%rotating_fraction%"
    - "&bClics en contenedor (10s): &f%fast_click_count%"
    - "&bEventos inactivos (3m): &f%idle_events%"
    - "&bCambios de herramienta (1m): &f%tool_chain_cycles%"
    - "&bReacciones al daño (5m): &f%reaction_pairs% &7(avg &f%reaction_mean_ms%&7 ms)"
    - "&bVentana de maza: &f%mace_band%"
    - "&bInformes de paquete fijos: &f%pack_fixed%"
    - "&bRecogidas rápidas: &f%fish_quick%"
    - "&bImpulsos de cohete: &f%firework_boosts%"
    - "&7======================"
help:
    - "&7======================"
    - "/aethel alerts &f- &7Alternar alertas"
    - "/aethel brands &f- &7Toggle brands"
    - "/aethel profile <player> &f- &7Mostrar informacion del jugador"
    - "/aethel help &f- &7Mostrar este mensaje de ayuda"
    - "/aethel debug <player> &f- &7Salida de predicciones para desarrolladores"
    - "/aethel perf &f- &7ms/predicción para los desarrolladores"
    - "/aethel reload &f- &7Recarga la configuración"
    - "/aethel spectate <player> &f- &7Espectar a un jugador"
    - "/aethel verbose &f- &7Te muestra todo aviso, sin buffers"
    - "/aethel log [0-255] &f- &7Sube un registro de depuración para avisos de predicciones"
    - "/aethel history <player> &f- &7Lista de sesiones (más nuevas primero)"
    - "/aethel history <player> page <N> &f- &7Saltar a la página N de la lista de sesiones"
    - "/aethel history <player> session <N|latest> [-d] [-v] &f- &7Detalle de la sesión (violaciones más recientes primero)"
    - "/aethel history <player> session <N|latest> page <N> [-d] [-v] &f- &7Detalle de la sesión, página N de violaciones"
    - "&7======================"

# === /aethel history ===
# UI de historial basada en sesiones. Todas las líneas siguientes son plantillas
# MiniMessage configurables. Los hovers predeterminados viven en etiquetas inline
# <hover:show_text:'...'> y en las claves de fragmentos de hover de abajo; quita
# el hover inline para usar el fallback del renderer.

aethel-history-load-failure: "%prefix% &c¡El subsistema de historial no se pudo cargar! Revisa la consola del servidor en busca de errores."
aethel-history-disabled: "%prefix% &c¡El subsistema de historial está deshabilitado!"
aethel-history-failed: "%prefix% &cError al cargar el historial: &7%error%"
aethel-history-unknown-player: "%prefix% &cJugador desconocido: &f%player%"
aethel-history-no-sessions: "%prefix% &7Sin historial de sesiones para &f%player%&7."
aethel-history-session-not-found: "%prefix% &cSesión &f%ordinal%&c no encontrada para &f%player%&c."

# Lista de sesiones — placeholders válidos: %prefix% %player% %page% %max_pages%
aethel-history-header: "%prefix% &bMostrando historial de sesiones de &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Línea de resumen de una sesión — placeholders válidos:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% se expande a aethel-history-crashed-marker para sesiones cuya
# conexión cayó sin cierre limpio (caída del servidor, kill -9, RST de canal
# que no disparó UserDisconnectEvent). Cadena vacía para sesiones en curso o
# cerradas correctamente.
aethel-history-session: "<hover:show_text:'&bSesión &7%session_uuid%<newline>&7Haz clic o ejecuta &e%detail_command%<newline>&7para ver los detalles de la sesión.'>%prefix% &8[&b%aethel_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSesión &f%ordinal%&b, duración &f%duration%&b, con &c%violations%&b violaciones &8[&c%unique_checks%&8]%crashed_marker% &8(&7hace %timeago%&8)</hover>"

# Marcador en línea sustituido en %crashed_marker% para sesiones cuyo
# closed_at == last_activity (es decir, marcadas por el barrido de cierre del
# siguiente arranque, no por la ruta de desconexión). Incluye un espacio
# inicial para que el marcador se lea natural cuando aparece y desaparezca
# limpiamente cuando está vacío.
aethel-history-crashed-marker: " &8(&ccaída&8)"

# Detalle de sesión — placeholders válidos:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
aethel-history-detail-header: "%prefix% &bMostrando detalle de la sesión &f%ordinal% &bde &f%player%&b:"
aethel-history-detail-meta1: "%prefix% &bAethel: &f%aethel_version%&b, Servidor: &f%server_name%&b, Duración: &f%duration%&b, Fecha: &7hace %timeago%"
aethel-history-detail-meta2: "%prefix% &bCliente: &f%client_version%&b, Marca: &f%client_brand%"
aethel-history-detail-violations-header: "%prefix% &bViolaciones: &8(%violations% en total, %unique_checks% únicas)"
aethel-history-detail-empty: "%prefix% &7- (ninguna)"
# Fila agrupada (predeterminado) — placeholders válidos: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% se construye uniendo entradas aethel-history-check-count con ", "
aethel-history-detail-group: "<hover:show_text:'&bViolaciones en &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
aethel-history-detail-group-hover: "&bViolaciones en &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
aethel-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
aethel-history-hover-description: " — &f%description%"
aethel-history-detail-group-hover-verbose: " — &7%verbose%"
# Fila de violación bruta (--detailed) — placeholders válidos:
#   %prefix% %offset% %check% %description% %vl% %verbose%
aethel-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
aethel-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
aethel-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Formato interno por check dentro de %checks_list% — placeholders válidos: %check_name% %count%
aethel-history-check-count: "&f%check_name%&7 x&c%count%"

# Marcadores de esquema — ver el comentario de cabecera en config.yml.
config-flavor: V2
config-version: 6

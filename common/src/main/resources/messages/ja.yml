    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cこのコマンドはプレイヤーのみが使用できます！"
run-as-player-or-console: "%prefix% &cこのコマンドはプレイヤーまたはコンソールからのみ使用できます！"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# 使用可能なプレースホルダー:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - 違反回数
# %verbose% - チェックからの追加情報（全てのチェックが情報を追加するわけではありません）
alerts-format: "%prefix% &f%player% が <hover:show_text:\"&b%check_name%%experimental%\n&8説明: &f%description%\">&b%check_name%%experimental%</hover> &fに失敗しました (x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cプロキシ&f] &f%player% が <hover:show_text:\"&b%check_name%%experimental%\n&8説明: &f%description%\">&b%check_name%%experimental%</hover> &fに失敗しました (x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &b%player% のプロファイル"
    - "&bPing: &f%ping%"
    - "&bバージョン: &f%version%"
    - "&bクライアントブランド: &f%brand%"
    - "&b水平感度: &f%h_sensitivity%%"
    - "&b垂直感度: &f%v_sensitivity%%"
    - "&bFastMath 有効: &f%fast_math%"
    - "&b攻撃/秒 (60秒): &f%attack_cps%"
    - "&b攻撃間隔CV: &f%attack_cadence_cv%"
    - "&b回転中の攻撃: &f%rotating_fraction%"
    - "&bコンテナクリック (10秒): &f%fast_click_count%"
    - "&b放置イベント (3分): &f%idle_events%"
    - "&bツール切替 (1分): &f%tool_chain_cycles%"
    - "&b被ダメージ反応 (5分): &f%reaction_pairs% &7(avg &f%reaction_mean_ms%&7 ms)"
    - "&7======================"
help:
    - "&7======================"
    - "/aethel alerts &f- &7アラートを切り替えます"
    - "/aethel brands &f- &7Toggle brands"
    - "/aethel profile <player> &f- &7プレイヤー情報を表示します"
    - "/aethel help &f- &7このヘルプメッセージを表示します"
    - "/aethel debug <player> &f- &7開発者用の予測出力を表示します"
    - "/aethel perf &f- &7開発者用のパフォーマンス (ms/予測)"
    - "/aethel reload &f- &7設定をリロードします"
    - "/aethel spectate <player> &f- &7プレイヤーを観戦します"
    - "/aethel verbose &f- &7全てのフラグをバッファなしで表示します"
    - "/aethel log [0-255] &f- &7予測フラグのデバッグログをアップロードします"
    - "/aethel history <player> &f- &7セッション一覧（新しい順）"
    - "/aethel history <player> page <N> &f- &7セッション一覧の N ページ目へ移動"
    - "/aethel history <player> session <N|latest> [-d] [-v] &f- &7セッション詳細（新しい違反順）"
    - "/aethel history <player> session <N|latest> page <N> [-d] [-v] &f- &7セッション詳細の違反 N ページ目"
    - "&7======================"

# === /aethel history ===
# セッション単位の履歴 UI です。下記すべての行は設定可能な MiniMessage
# テンプレートです。既定のホバーはインラインの <hover:show_text:'...'> タグと
# 下記のホバー断片キーにあります。インラインホバーを消すとレンダラーの
# フォールバックが使われます。

aethel-history-load-failure: "%prefix% &c履歴サブシステムの読み込みに失敗しました！サーバーコンソールでエラーを確認してください。"
aethel-history-disabled: "%prefix% &c履歴サブシステムは無効です！"
aethel-history-failed: "%prefix% &c履歴の読み込みに失敗しました：&7%error%"
aethel-history-unknown-player: "%prefix% &c不明なプレイヤー：&f%player%"
aethel-history-no-sessions: "%prefix% &7&f%player% &7のセッション履歴はありません。"
aethel-history-session-not-found: "%prefix% &c&f%player% &cの第 &f%ordinal% &c回セッションが見つかりません。"

# セッション一覧 — 有効なプレースホルダ: %prefix% %player% %page% %max_pages%
aethel-history-header: "%prefix% &b&f%player% &bのセッション履歴 &8[&f%page%&7/&f%max_pages%&8]"
# セッション概要行 — 有効なプレースホルダ:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# サーバークラッシュ・kill -9・UserDisconnectEvent を発火しないチャネル RST など、
# 接続が正常終了せずに失われたセッションでは %crashed_marker% が
# aethel-history-crashed-marker に展開されます。継続中／正常終了したセッションでは
# 空文字列になります。
aethel-history-session: "<hover:show_text:'&bセッション &7%session_uuid%<newline>&7クリックするか &e%detail_command% &7を実行<newline>&7してセッション詳細を表示します。'>%prefix% &8[&b%aethel_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &b第 &f%ordinal% &b回セッション、時間 &f%duration%&b、違反 &c%violations%&b 件 &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% 前&8)</hover>"

# closed_at == last_activity のセッション（つまり次回起動時のクラッシュ掃引で
# スタンプされ、切断パスを通っていない行）に対して %crashed_marker% に
# 差し込まれるインラインマーカーです。先頭にスペースを含めることで、
# 表示時は自然に読め、空のときはきれいに消えます。
aethel-history-crashed-marker: " &8(&cクラッシュ&8)"

# セッション詳細 — 有効なプレースホルダ:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
aethel-history-detail-header: "%prefix% &b&f%player% &bの第 &f%ordinal% &b回セッションの詳細："
aethel-history-detail-meta1: "%prefix% &bAethel: &f%aethel_version%&b, サーバー: &f%server_name%&b, 時間: &f%duration%&b, 日時: &7%timeago% 前"
aethel-history-detail-meta2: "%prefix% &bクライアント: &f%client_version%&b, ブランド: &f%client_brand%"
aethel-history-detail-violations-header: "%prefix% &b違反: &8(合計 %violations% 件、ユニーク %unique_checks% 件)"
aethel-history-detail-empty: "%prefix% &7- (なし)"
# グループ化された行（デフォルト） — 有効なプレースホルダ: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% は aethel-history-check-count の項目を ", " で連結したものです
aethel-history-detail-group: "<hover:show_text:'&b%bucket_start%–%bucket_end% の違反:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
aethel-history-detail-group-hover: "&b%bucket_start%–%bucket_end% の違反:%bucket_hover_entries%"
aethel-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
aethel-history-hover-description: " — &f%description%"
aethel-history-detail-group-hover-verbose: " — &7%verbose%"
# 単一の生違反行（--detailed） — 有効なプレースホルダ:
#   %prefix% %offset% %check% %description% %vl% %verbose%
aethel-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
aethel-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
aethel-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# %checks_list% の各チェック項目の内部書式 — 有効なプレースホルダ: %check_name% %count%
aethel-history-check-count: "&f%check_name%&7 x&c%count%"

# スキーマ用マーカー — config.yml のヘッダーコメントを参照。
config-flavor: V2
config-version: 4

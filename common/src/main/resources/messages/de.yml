# Gültige Platzhalter:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - Verstöße
# %verbose% - zusätzliche Informationen von der Prüfung, nicht alle Prüfungen liefern zusätzliche Informationen
alerts-format: "%prefix% &f%player% &bbestand <hover:show_text:\"&b%check_name%%experimental%\n&8Beschreibung: &f%description%\">&f%check_name%%experimental%</hover> &bnicht &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bbestand <hover:show_text:\"&b%check_name%%experimental%\n&8Beschreibung: &f%description%\">&f%check_name%%experimental%</hover> &bnicht &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfil für &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersion: &f%version%"
    - "&bClient Marke: &f%brand%"
    - "&bHorizontale Sensitivität: &f%h_sensitivity%%"
    - "&bVertikale Sensitivität: &f%v_sensitivity%%"
    - "&bFastMath aktiviert: &f%fast_math%"
    - "&bAngriffe/s (60s): &f%attack_cps%"
    - "&bAngriffskadenz-CV: &f%attack_cadence_cv%"
    - "&bRotierende Angriffe: &f%rotating_fraction%"
    - "&bContainer-Klicks (10s): &f%fast_click_count%"
    - "&bInaktive Events (3m): &f%idle_events%"
    - "&bWerkzeugwechsel (1m): &f%tool_chain_cycles%"
    - "&bSchadensreaktionen (5m): &f%reaction_pairs% &7(avg &f%reaction_mean_ms%&7 ms)"
    - "&bMace-Smash-Fenster: &f%mace_band%"
    - "&bFeste Pack-Meldungen: &f%pack_fixed%"
    - "&bSchnelle Einholvorgänge: &f%fish_quick%"
    - "&bFeuerwerks-Boosts: &f%firework_boosts%"
    - "&7======================"
help:
    - "&7======================"
    - "/aethel alerts &f- &7Schaltet Benachrichtigungen um"
    - "/aethel brands &f- &7Toggle brands"
    - "/aethel profile <player> &f- &7Zeigt Informationen über einen Spieler an"

    - "/aethel history <player> session <N|latest> [-d] [-v] &f- &7Sitzungsdetails (neueste Verstöße zuerst)"
    - "/aethel history <player> session <N|latest> page <N> [-d] [-v] &f- &7Sitzungsdetails, Verstoß-Seite N"
    - "&7======================"

# === /aethel history ===
# Sitzungsbasierte Verlaufs-UI. Alle Zeilen unten sind konfigurierbare
# MiniMessage-Vorlagen. Standard-Hover stehen in Inline-Tags
# <hover:show_text:'...'> und den Hover-Fragment-Schlüsseln unten; entferne
# den Inline-Hover, um den Renderer-Fallback zu verwenden.

aethel-history-load-failure: "%prefix% &cDas Verlaufs-Subsystem konnte nicht geladen werden! Überprüfe die Serverkonsole auf Fehler."
aethel-history-disabled: "%prefix% &cDas History-Subsystem ist deaktiviert!"
aethel-history-failed: "%prefix% &cVerlauf konnte nicht geladen werden: &7%error%"
aethel-history-unknown-player: "%prefix% &cUnbekannter Spieler: &f%player%"
aethel-history-no-sessions: "%prefix% &7Keine Sitzungs-Historie für &f%player%&7."
aethel-history-session-not-found: "%prefix% &cSitzung &f%ordinal%&c für &f%player%&c nicht gefunden."

# Sitzungsliste — gültige Platzhalter: %prefix% %player% %page% %max_pages%
aethel-history-header: "%prefix% &bZeige Sitzungs-Historie für &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Einzelne Sitzungszeile — gültige Platzhalter:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% wird zu aethel-history-crashed-marker erweitert für Sitzungen,
# deren Verbindung ohne sauberes Schließen wegfiel (Server-Crash, kill -9,
# Channel-RST ohne UserDisconnectEvent). Für laufende oder sauber geschlossene
# Sitzungen leerer String.
aethel-history-session: "<hover:show_text:'&bSitzung &7%session_uuid%<newline>&7Klicke oder führe &e%detail_command% &7aus<newline>&7um Sitzungsdetails anzuzeigen.'>%prefix% &8[&b%aethel_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSitzung &f%ordinal%&b, Dauer &f%duration%&b, &c%violations%&b Verstöße &8[&c%unique_checks%&8]%crashed_marker% &8(&7vor %timeago%&8)</hover>"

# Inline-Marker, der in %crashed_marker% eingesetzt wird bei Sitzungen mit
# closed_at == last_activity (also vom Crash-Sweep beim nächsten Start
# gestempelt, nicht vom Disconnect-Pfad). Mit führendem Leerzeichen, damit
# der Marker beim Vorhandensein natürlich liest und beim Fehlen verschwindet.
aethel-history-crashed-marker: " &8(&cabgestürzt&8)"

# Sitzungsdetails — gültige Platzhalter:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
aethel-history-detail-header: "%prefix% &bDetails zu Sitzung &f%ordinal% &bvon &f%player%&b:"
aethel-history-detail-meta1: "%prefix% &bAethel: &f%aethel_version%&b, Server: &f%server_name%&b, Dauer: &f%duration%&b, Datum: &7vor %timeago%"
aethel-history-detail-meta2: "%prefix% &bClient: &f%client_version%&b, Marke: &f%client_brand%"
aethel-history-detail-violations-header: "%prefix% &bVerstöße: &8(%violations% gesamt, %unique_checks% verschiedene)"
aethel-history-detail-empty: "%prefix% &7- (keine)"
# Gruppenzeile (Standard) — gültige Platzhalter: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% wird gebaut aus aethel-history-check-count-Einträgen, getrennt mit ", "
aethel-history-detail-group: "<hover:show_text:'&bVerstöße in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
aethel-history-detail-group-hover: "&bVerstöße in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
aethel-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
aethel-history-hover-description: " — &f%description%"
aethel-history-detail-group-hover-verbose: " — &7%verbose%"
# Einzelner Verstoß (--detailed) — gültige Platzhalter:
#   %prefix% %offset% %check% %description% %vl% %verbose%
aethel-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
aethel-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
aethel-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Inneres Format für jeden Check in einer Gruppen-%checks_list% — gültige Platzhalter: %check_name% %count%
aethel-history-check-count: "&f%check_name%&7 x&c%count%"

# Schema-Marker — siehe Kopf-Kommentar in config.yml.
config-flavor: V2

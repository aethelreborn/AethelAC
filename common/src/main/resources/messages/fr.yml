# \u00BB se traduit par » (double >>). Les interprétations diffèrent entre les normes ANSI et UTF-8... vous pouvez même voir ? en raison de cela
prefix: "&bAethel &8\u00BB"

alerts-enabled: "%prefix% &fAlertes activées"
alerts-disabled: "%prefix% &fAlertes désactivées"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% a rejoint en utilisant %brand%"
console-specify-target: "%prefix% &cVous devez spécifier une cible en tant que console !"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cPlayer est ignoré ou hors ligne !"
player-not-this-server: "%prefix% &cPlayer n'est pas sur ce serveur !"
sender-not-found: "%prefix% &cVous ne pouvez pas utiliser cette commande si vous êtes exempté !"
spectate-return: "<click:run_command:/aethel stopspectating><hover:show_text:\"/aethel stopspectating\">\n%prefix% &fClickez ici pour retourner à votre position d'origine\n</hover></click>"
cannot-spectate-return: "%prefix% &cVous pouvez faire cela uniquement en étant en spectateur"
cannot-run-on-self: "%prefix% &cVous ne pouvez pas utiliser cette commande sur vous-même !"
upload-log: "%prefix% &fLe fichier de débogage a été téléversé vers : %url%"
upload-log-start: "%prefix% &fTéléversement du journal... Veuillez patienter"
upload-log-not-found: "%prefix% &cUImpossible de trouver le journal de débogage"
upload-log-upload-failure: "%prefix% &cUne erreur est survenue lors du téléversement de ce journal, regardez la console pour plus d'information"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cCette commande ne peut être utilisée que par les joueurs !"
run-as-player-or-console: "%prefix% &cCette commande ne peut être utilisée que par les joueurs ou la console !"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Placeholders valides :
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - Informations supplémentaires sur les vérifivations comme les écarts, toutes les vérifications n'ajoutent pas d'information
alerts-format: "%prefix% &f%player% &ba échoué <hover:show_text:\"&b%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &ba échoué <hover:show_text:\"&b%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersion du client : &f%version%"
    - "&bNature du client : &f%brand%"
    - "&bSensibilité Horizontale : &f%h_sensitivity%%"
    - "&bSensibilité Verticale : &f%v_sensitivity%%"
    - "&bFastMath est activé : &f%fast_math%"
    - "&bAttaques/s (60s): &f%attack_cps%"
    - "&bCV de cadence: &f%attack_cadence_cv%"
    - "&bAttaques en rotation: &f%rotating_fraction%"
    - "&bClics d'inventaire (10s): &f%fast_click_count%"
    - "&bÉvénements inactifs (3m): &f%idle_events%"
    - "&bChangements d'outil (1m): &f%tool_chain_cycles%"
    - "&bRéactions aux dégâts (5m): &f%reaction_pairs% &7(avg &f%reaction_mean_ms%&7 ms)"
    - "&7======================"
help:
    - "&7======================"
    - "/aethel alerts &f- &7Activer/Désactiver les alertes"
    - "/aethel brands &f- &7Toggle brands"
    - "/aethel profile <player> &f- &7Voir le profil du joueur"
    - "/aethel help &f- &7Afficher l'aide"
    - "/aethel debug <player> &f- &7Afficher les informations de débogage du joueur"
    - "/aethel perf &f- &7Afficher les informations de performance"
    - "/aethel reload &f- &7Recharger la configuration"
    - "/aethel spectate <player> &f- &7Regarder un joueur"
    - "/aethel verbose &f- &7Affiche chaqu'une de vos violations, sans tampons"
    - "/aethel log [0-255] &f- &7Téléverse un journal de débogage pour les indicateurs de prédiction"
    - "/aethel history <player> &f- &7Liste des sessions (les plus récentes en premier)"
    - "/aethel history <player> page <N> &f- &7Aller à la page N de la liste des sessions"
    - "/aethel history <player> session <N|latest> [-d] [-v] &f- &7Détail d'une session (violations les plus récentes en premier)"
    - "/aethel history <player> session <N|latest> page <N> [-d] [-v] &f- &7Détail d'une session, page N des violations"
    - "&7======================"

# === /aethel history ===
# UI d'historique basée sur les sessions. Toutes les lignes ci-dessous sont des
# modèles MiniMessage configurables. Les hovers par défaut vivent dans les tags
# inline <hover:show_text:'...'> et les clés de fragments de hover ci-dessous ;
# retirez le hover inline pour utiliser le fallback du renderer.

aethel-history-load-failure: "%prefix% &cLe sous-système d'historique n'a pas pu être chargé ! Vérifiez la console du serveur pour les erreurs."
aethel-history-disabled: "%prefix% &cLe sous-système d'historique est désactivé !"
aethel-history-failed: "%prefix% &cÉchec du chargement de l'historique : &7%error%"
aethel-history-unknown-player: "%prefix% &cJoueur inconnu : &f%player%"
aethel-history-no-sessions: "%prefix% &7Pas d'historique de sessions pour &f%player%&7."
aethel-history-session-not-found: "%prefix% &cSession &f%ordinal%&c introuvable pour &f%player%&c."

# Liste des sessions — placeholders valides : %prefix% %player% %page% %max_pages%
aethel-history-header: "%prefix% &bAffichage de l'historique des sessions pour &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Ligne de résumé d'une session — placeholders valides :
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% s'étend en aethel-history-crashed-marker pour les sessions
# dont la connexion a disparu sans fermeture propre (crash serveur, kill -9,
# RST de canal sans UserDisconnectEvent). Chaîne vide pour les sessions en
# cours ou closes proprement.
aethel-history-session: "<hover:show_text:'&bSession &7%session_uuid%<newline>&7Cliquez ou exécutez &e%detail_command%<newline>&7pour afficher les détails de la session.'>%prefix% &8[&b%aethel_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSession &f%ordinal%&b, durée &f%duration%&b, avec &c%violations%&b violations &8[&c%unique_checks%&8]%crashed_marker% &8(&7il y a %timeago%&8)</hover>"

# Marqueur en ligne substitué dans %crashed_marker% pour les sessions dont
# closed_at == last_activity (c.-à-d. estampillées par le balayage de crash
# au prochain démarrage, et non par le chemin de déconnexion). Inclut un
# espace de tête pour que le marqueur se lise naturellement quand il est
# présent et disparaisse proprement quand il est vide.
aethel-history-crashed-marker: " &8(&ccrash&8)"

# Détail de session — placeholders valides :
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
aethel-history-detail-header: "%prefix% &bDétail de la session &f%ordinal% &bde &f%player%&b :"
aethel-history-detail-meta1: "%prefix% &bAethel : &f%aethel_version%&b, Serveur : &f%server_name%&b, Durée : &f%duration%&b, Date : &7il y a %timeago%"
aethel-history-detail-meta2: "%prefix% &bClient : &f%client_version%&b, Marque : &f%client_brand%"
aethel-history-detail-violations-header: "%prefix% &bViolations : &8(%violations% au total, %unique_checks% uniques)"
aethel-history-detail-empty: "%prefix% &7- (aucune)"
# Ligne groupée (par défaut) — placeholders valides : %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% est construite en joignant les entrées aethel-history-check-count avec ", "
aethel-history-detail-group: "<hover:show_text:'&bViolations entre &f%bucket_start%–%bucket_end%&b :%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
aethel-history-detail-group-hover: "&bViolations entre &f%bucket_start%–%bucket_end%&b :%bucket_hover_entries%"
aethel-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
aethel-history-hover-description: " — &f%description%"
aethel-history-detail-group-hover-verbose: " — &7%verbose%"
# Ligne de violation brute (--detailed) — placeholders valides :
#   %prefix% %offset% %check% %description% %vl% %verbose%
aethel-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
aethel-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
aethel-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Format interne pour chaque check dans %checks_list% — placeholders valides : %check_name% %count%
aethel-history-check-count: "&f%check_name%&7 x&c%count%"

# Marqueurs de schéma — voir le commentaire d'en-tête dans config.yml.
config-flavor: V2
config-version: 3

# \u00BB é » (>> duplo), ANSI e UTF-8 interpretam isso diferentemente... você pode acabar vendo '?' por conta disso.
prefix: "&bAethel &8\u00BB"

alerts-enabled: "%prefix% &fAlertas habilitados."
alerts-disabled: "%prefix% &fAlertas desabilitados."
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% entrou usando %brand%."
console-specify-target: "%prefix% &cVocê deve especificar o nome do alvo!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cJogador não encontrado!"
player-not-this-server: "%prefix% &cO jogador não está no servidor!"
sender-not-found: "%prefix% &cVocê não pode usar este comando se estiver isento!"
spectate-return: "<click:run_command:/aethel stopspectating><hover:show_text:\"/aethel stopspectating\">\n%prefix% &fClique aqui para retornar a localização anterior\n</hover></click>"
cannot-spectate-return: "%prefix% &cVocê só pode fazer isso após espectar um jogador."
cannot-run-on-self: "%prefix% &cVocê não pode usar esse comando em sí mesmo!"
upload-log: "%prefix% &fRegistro enviado para: %url%"
upload-log-start: "%prefix% &fEnviando o registro. Aguarde."
upload-log-not-found: "%prefix% &cNúmero do registro não encontrado."
upload-log-upload-failure: "%prefix% &cAlgo deu errado ao enviar o registro, veja o terminal para mais informações."
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cEste comando só pode ser usado por jogadores!"
run-as-player-or-console: "%prefix% &cEste comando só pode ser usado por jogadores ou pelo console!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Placeholders válidos:
# %prefix%
# %player%
# %check_name%
# %experimental%
# %vl% - violações
# %verbose% - Informação extra da verificação, como os desalinhamentos, nem todas as verifiações terão essa informação.
alerts-format: "%prefix% &f%player% &bfalhou em <hover:show_text:\"&b%check_name%%experimental%\n&8Descrição: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfalhou em <hover:show_text:\"&b%check_name%%experimental%\n&8Descrição: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"
profile:
    - "&7======================"
    - "%prefix% &bPerfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersão: &f%version%"
    - "&bNome do Cliente: &f%brand%"
    - "&bSensibilidade Horizontal: &f%h_sensitivity%%"
    - "&bSensibilidade Vertical: &f%v_sensitivity%%"
    - "&bFastMath: &f%fast_math%"
    - "&bAtaques/s (60s): &f%attack_cps%"
    - "&bCV de cadência: &f%attack_cadence_cv%"
    - "&bAtaques em rotação: &f%rotating_fraction%"
    - "&bCliques em contêiner (10s): &f%fast_click_count%"
    - "&bEventos inativos (3m): &f%idle_events%"
    - "&bTrocas de ferramenta (1m): &f%tool_chain_cycles%"
    - "&bReações a dano (5m): &f%reaction_pairs% &7(avg &f%reaction_mean_ms%&7 ms)"
    - "&7======================"
help:
    - "&7======================"
    - "/aethel alerts &f- &7Alterna noificações."
    - "/aethel brands &f- &7Toggle brands"
    - "/aethel profile <player> &f- &7Mosta as informações do jogador."
    - "/aethel help &f- &7Mostra essa mensagem de ajuda."
    - "/aethel debug <player> &f- &7Depura a simulação."
    - "/aethel perf &f- &7Depura a performance."
    - "/aethel reload &f- &7Recarrega as configurações."
    - "/aethel spectate <player> &f- &7Especta um jogador."
    - "/aethel verbose &f- &7Esconde as informações extra."
    - "/aethel log [0-255] &f- &7Envia o registro da simulação."
    - "/aethel history <player> &f- &7Lista de sessões (mais recentes primeiro)"
    - "/aethel history <player> page <N> &f- &7Pular para a página N da lista de sessões"
    - "/aethel history <player> session <N|latest> [-d] [-v] &f- &7Detalhe da sessão (violações mais recentes primeiro)"
    - "/aethel history <player> session <N|latest> page <N> [-d] [-v] &f- &7Detalhe da sessão, página N de violações"
    - "&7======================"

# === /aethel history ===
# UI de histórico baseada em sessões. Todas as linhas abaixo são modelos
# MiniMessage configuráveis. Os hovers padrão ficam nas tags inline
# <hover:show_text:'...'> e nas chaves de fragmento de hover abaixo; remova
# o hover inline para usar o fallback do renderer.

aethel-history-load-failure: "%prefix% &cO subsistema de histórico falhou ao carregar! Verifique o console do servidor por erros."
aethel-history-disabled: "%prefix% &cO subsistema de histórico está desativado!"
aethel-history-failed: "%prefix% &cFalha ao carregar o histórico: &7%error%"
aethel-history-unknown-player: "%prefix% &cJogador desconhecido: &f%player%"
aethel-history-no-sessions: "%prefix% &7Sem histórico de sessões para &f%player%&7."
aethel-history-session-not-found: "%prefix% &cSessão &f%ordinal%&c não encontrada para &f%player%&c."

# Lista de sessões — placeholders válidos: %prefix% %player% %page% %max_pages%
aethel-history-header: "%prefix% &bMostrando histórico de sessões de &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Linha de resumo de sessão — placeholders válidos:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% expande para aethel-history-crashed-marker em sessões cuja
# conexão caiu sem fechamento limpo (queda do servidor, kill -9, RST de canal
# que não disparou UserDisconnectEvent). String vazia para sessões em curso
# ou encerradas normalmente.
aethel-history-session: "<hover:show_text:'&bSessão &7%session_uuid%<newline>&7Clique ou execute &e%detail_command%<newline>&7para ver os detalhes da sessão.'>%prefix% &8[&b%aethel_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSessão &f%ordinal%&b, duração &f%duration%&b, com &c%violations%&b violações &8[&c%unique_checks%&8]%crashed_marker% &8(&7há %timeago%&8)</hover>"

# Marcador inline substituído em %crashed_marker% para sessões cujo
# closed_at == last_activity (ou seja, marcadas pelo varrimento de queda no
# próximo arranque, não pelo caminho de desconexão). Inclui um espaço inicial
# para que o marcador leia naturalmente quando presente e desapareça
# limpamente quando vazio.
aethel-history-crashed-marker: " &8(&cqueda&8)"

# Detalhe de sessão — placeholders válidos:
#   %prefix% %player% %ordinal% %aethel_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
aethel-history-detail-header: "%prefix% &bDetalhe da sessão &f%ordinal% &bde &f%player%&b:"
aethel-history-detail-meta1: "%prefix% &bAethel: &f%aethel_version%&b, Servidor: &f%server_name%&b, Duração: &f%duration%&b, Data: &7há %timeago%"
aethel-history-detail-meta2: "%prefix% &bCliente: &f%client_version%&b, Marca: &f%client_brand%"
aethel-history-detail-violations-header: "%prefix% &bViolações: &8(%violations% no total, %unique_checks% únicas)"
aethel-history-detail-empty: "%prefix% &7- (nenhuma)"
# Linha agrupada (padrão) — placeholders válidos: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% é construída unindo entradas aethel-history-check-count com ", "
aethel-history-detail-group: "<hover:show_text:'&bViolações em &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
aethel-history-detail-group-hover: "&bViolações em &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
aethel-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
aethel-history-hover-description: " — &f%description%"
aethel-history-detail-group-hover-verbose: " — &7%verbose%"
# Linha de violação bruta (--detailed) — placeholders válidos:
#   %prefix% %offset% %check% %description% %vl% %verbose%
aethel-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
aethel-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
aethel-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Formato interno por check em %checks_list% — placeholders válidos: %check_name% %count%
aethel-history-check-count: "&f%check_name%&7 x&c%count%"

# Marcadores de esquema — ver o comentário do cabeçalho em config.yml.
config-flavor: V2
config-version: 4

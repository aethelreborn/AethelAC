name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'aethelreborn/AethelAC'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            next="v1"
          else
            rest="${latest#v}"
            major="${rest%%.*}"
            if [ "${rest}" = "${major}" ]; then
              minor=0
              next="v${major}.1"
            else
              minor="${rest#*.}"
              if [ "${minor}" -lt 24 ]; then
                next="v${major}.$((minor + 1))"
              else
                next="v$((major + 1))"
              fi
            fi
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${next}"

      - name: Build
        env:
          AETHEL_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Prelease=true --no-daemon --stacktrace

      - name: Assemble distribution
        run: |
          mkdir -p dist
          cp bukkit/build/libs/aethelac-bukkit-*.jar dist/
          cp fabric/build/libs/aethelac-fabric-*.jar dist/
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.jar \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
